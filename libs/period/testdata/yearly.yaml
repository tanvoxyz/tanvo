    subscription_at: 2021-01-01
    billing_at: 2022-03-02
    want: {to: 2022-01-01}
  - name: to anniversary on the first day of a month
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:266
    billing_time: anniversary
    subscription_at: 2022-12-01
    billing_at: 2024-01-02
    want: {to: 2023-12-01}
  - name: to anniversary in advance is the end of the current period
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:274
