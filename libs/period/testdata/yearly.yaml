# Ported from lago spec/services/subscriptions/dates/yearly_service_spec.rb.
# Periods are half-open: lago's "23:59:59" ends are the next midnight here.
# The subscription date 2021-02-02 is 2021-02-01 in America/New_York.
defaults:
  interval: yearly
  subscription_at: 2021-02-02
  billing_at: 2022-03-07
  timezone: UTC

cases:
  # from_datetime
  - name: from calendar is the beginning of the previous year
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:38
    billing_time: calendar
    billing_at: 2022-01-01
    subscription_at: 2019-02-02
    want: {from: 2021-01-01}
  - name: from calendar not started
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:45
    billing_time: calendar
    billing_at: 2022-01-01
    subscription_at: 2019-02-02
    started_at: null
    want: {from: null, charges_to: null}
  - name: from calendar with timezone
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:53
    billing_time: calendar
    billing_at: 2022-01-01
    subscription_at: 2019-02-02
    timezone: America/New_York
    want: {from: 2020-01-01T05:00:00Z}
  - name: from calendar before start date
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:61
    billing_time: calendar
    billing_at: 2022-01-01
    subscription_at: 2019-02-02
    started_at: 2021-02-07
    want: {from: 2021-02-07}
  - name: from calendar before start date with timezone
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:68
    billing_time: calendar
    billing_at: 2022-01-01
    subscription_at: 2019-02-02
    started_at: 2021-02-07
    timezone: America/New_York
    want: {from: 2021-02-06T05:00:00Z}
  - name: from calendar just terminated
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:79
    billing_time: calendar
    billing_at: 2022-03-10
    subscription_at: 2019-02-02
    terminated_at: 2022-03-09
    want: {from: 2022-01-01}
  - name: from calendar just terminated in advance
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:86
    billing_time: calendar
    pay_in_advance: true
    billing_at: 2022-03-10
    subscription_at: 2019-02-02
    terminated_at: 2022-03-09
    want: {from: 2022-01-01}
  - name: from anniversary is the previous year day and month
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:97
    billing_time: anniversary
    billing_at: 2022-02-02
    want: {from: 2021-02-02}
  - name: from anniversary current usage in the anniversary month before the day
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:106
    billing_time: anniversary
    current_usage: true
    subscription_at: 2023-03-29
    billing_at: 2024-03-15
    want: {from: 2023-03-29}
  - name: from anniversary before start date
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:114
    billing_time: anniversary
    billing_at: 2022-02-02
    started_at: 2022-09-02
    want: {from: 2022-09-02}
  - name: from anniversary of a leap day billed on the clamped anniversary
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:126
    billing_time: anniversary
    subscription_at: 2020-02-29
    billing_at: 2025-02-28
    want: {from: 2024-02-29}
  - name: from anniversary just terminated
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:134
    billing_time: anniversary
    billing_at: 2022-02-02
    terminated_at: 2022-02-01
    want: {from: 2022-02-02}
  - name: from anniversary just terminated in advance
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:141
    billing_time: anniversary
    pay_in_advance: true
    billing_at: 2022-02-02
    terminated_at: 2022-02-01
    want: {from: 2022-02-02}
  - name: from anniversary of a leap day just terminated
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:150
    billing_time: anniversary
    subscription_at: 2020-02-29
    billing_at: 2022-03-28
    terminated_at: 2022-02-01
    want: {from: 2022-02-28}
  # The run is before the termination, and the period it bills starts
  # before the subscription.
  - name: from anniversary terminated later billed before the anniversary month
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:158
    billing_time: anniversary
    billing_at: 2022-01-03
    terminated_at: 2022-02-01
    want: {from: 2021-02-02}

  # to_datetime
  - name: to calendar is the end of the previous year
