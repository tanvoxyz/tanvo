    pay_in_advance: true
    billing_at: 2022-02-02
    want: {to: 2023-02-02}
  - name: to anniversary just terminated
    source: spec/services/subscriptions/dates/yearly_service_spec.rb:287
    billing_time: anniversary
    billing_at: 2022-02-02
    terminated_at: 2022-01-02
    want: {to: 2022-01-02}

