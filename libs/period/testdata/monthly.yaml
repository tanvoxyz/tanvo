# Ported from lago spec/services/subscriptions/dates/monthly_service_spec.rb.
# Periods are half-open: lago's "23:59:59" ends are the next midnight here.
# The subscription date 2021-02-02 is 2021-02-01 in America/New_York.
defaults:
  interval: monthly
  subscription_at: 2021-02-02
  billing_at: 2022-03-07
  timezone: UTC

cases:
  # from_datetime
  - name: from calendar is the beginning of the previous month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:40
    billing_time: calendar
    billing_at: 2022-03-01
    want: {from: 2022-02-01}
  - name: from calendar not started
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:47
    billing_time: calendar
    billing_at: 2022-03-01
    started_at: null
    want: {from: null}
  - name: from calendar with timezone
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:55
    billing_time: calendar
    billing_at: 2022-03-01
    timezone: America/New_York
    want: {from: 2022-01-01T05:00:00Z}
  - name: from calendar before start date
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:63
    billing_time: calendar
    billing_at: 2022-03-01
    started_at: 2022-02-07T05:00:00Z
    want: {from: 2022-02-07}
  - name: from calendar before start date with timezone
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:70
    billing_time: calendar
    billing_at: 2022-03-01
    started_at: 2022-02-07T05:00:00Z
    timezone: America/New_York
    want: {from: 2022-02-07T05:00:00Z}
  - name: from calendar just terminated
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:81
    billing_time: calendar
    billing_at: 2022-03-10
    terminated_at: 2022-03-09
    want: {from: 2022-03-01}
  - name: from calendar just terminated in advance
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:88
    billing_time: calendar
    pay_in_advance: true
    billing_at: 2022-03-10
    terminated_at: 2022-03-09
    want: {from: 2022-03-01}
  - name: from anniversary is the day in the previous month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:99
    billing_time: anniversary
    billing_at: 2022-03-02
    want: {from: 2022-02-02}
  - name: from anniversary before start date
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:106
    billing_time: anniversary
    billing_at: 2022-03-02
    started_at: 2022-02-08
    want: {from: 2022-02-08}
  - name: from anniversary just terminated
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:116
    billing_time: anniversary
    billing_at: 2022-03-10
    terminated_at: 2022-03-09
    want: {from: 2022-03-02}
  - name: from anniversary just terminated in advance
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:123
    billing_time: anniversary
    pay_in_advance: true
    billing_at: 2022-03-10
    terminated_at: 2022-03-09
    want: {from: 2022-03-02}
  - name: from anniversary just terminated before the anniversary day
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:132
    billing_time: anniversary
    subscription_at: 2021-03-31
    billing_at: 2022-03-29
    terminated_at: 2022-03-09
    want: {from: 2022-02-28}
  # The inner mark_as_terminated!("27 Jan 2022") keeps the outer 9 Mar 2022
  # termination (terminated_at ||= timestamp), so the run is before it.
  - name: from anniversary terminated later in January
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:143
    billing_time: anniversary
    subscription_at: 2021-03-27
    billing_at: 2022-01-28
    terminated_at: 2022-03-09
    want: {from: 2021-12-27}
  - name: from anniversary in advance on the last day of a short month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:155
    billing_time: anniversary
    pay_in_advance: true
    subscription_at: 2021-03-31
    billing_at: 2021-04-30
    want: {from: 2021-04-30}
  - name: from anniversary in advance on 29 February
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:163
    billing_time: anniversary
    pay_in_advance: true
    subscription_at: 2020-01-31
    billing_at: 2020-02-29
    want: {from: 2020-02-29}
  - name: from anniversary in arrears on the last day of a short month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:173
    billing_time: anniversary
    subscription_at: 2021-03-31
    billing_at: 2021-04-30
    want: {from: 2021-03-31}
  - name: from anniversary in arrears after a short month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:181
    billing_time: anniversary
    subscription_at: 2019-04-30
    billing_at: 2020-03-30
    want: {from: 2020-02-29}

