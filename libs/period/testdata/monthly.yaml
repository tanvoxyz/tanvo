    subscription_at: 2022-01-30
    billing_at: 2022-02-28
    want: {to: 2022-02-28}
  - name: to anniversary on the first day of the month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:306
    billing_time: anniversary
    subscription_at: 2022-01-01
    billing_at: 2022-03-02
    want: {to: 2022-03-01}
  - name: to anniversary in advance is the end of the current period
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:314
    billing_time: anniversary
    pay_in_advance: true
    billing_at: 2022-03-02
    want: {to: 2022-04-02}
  - name: to anniversary just terminated
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:329
    billing_time: anniversary
    billing_at: 2022-03-10
    terminated_at: 2022-03-02
    want: {to: 2022-03-02}

