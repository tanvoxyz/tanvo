    want: {to: 2022-01-02}
  - name: to anniversary when the day does not exist in the month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:289
    billing_time: anniversary
    subscription_at: 2022-01-31
    billing_at: 2022-02-28
    want: {to: 2022-02-28}
  - name: to anniversary on the 30th when the day does not exist in the month
    source: spec/services/subscriptions/dates/monthly_service_spec.rb:296
