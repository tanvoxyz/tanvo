# Ported from lago spec/services/subscriptions/dates/quarterly_service_spec.rb.
# The spec builds a monthly plan but runs the quarterly service directly; the
# cases use a quarterly plan. Periods are half-open: lago's "23:59:59" ends
# are the next midnight here.
defaults:
  interval: quarterly
  subscription_at: 2021-02-02
  billing_at: 2022-03-07
  timezone: UTC

cases:
  # from_datetime
  - name: from calendar is the beginning of the previous quarter
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:37
    billing_time: calendar
    billing_at: 2022-07-01
    want: {from: 2022-04-01}
  - name: from calendar not started
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:44
    billing_time: calendar
    billing_at: 2022-07-01
    started_at: null
    want: {from: null}
  - name: from calendar with timezone
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:52
    billing_time: calendar
    billing_at: 2022-07-01
    timezone: America/New_York
    want: {from: 2022-01-01T05:00:00Z}
  - name: from calendar before start date
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:60
    billing_time: calendar
    billing_at: 2022-07-01
    started_at: 2022-04-07
    want: {from: 2022-04-07}
  - name: from calendar before start date with timezone
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:67
    billing_time: calendar
    billing_at: 2022-07-01
    started_at: 2022-04-07
    timezone: America/New_York
    want: {from: 2022-04-06T04:00:00Z}
  - name: from calendar just terminated
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:78
    billing_time: calendar
    billing_at: 2022-07-10
    terminated_at: 2022-07-09
    want: {from: 2022-07-01}
  - name: from calendar just terminated in advance
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:85
    billing_time: calendar
    pay_in_advance: true
    billing_at: 2022-07-10
    terminated_at: 2022-07-09
    want: {from: 2022-07-01}
  - name: from anniversary is the same day in the previous quarter
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:96
    billing_time: anniversary
    billing_at: 2022-05-02
    want: {from: 2022-02-02}
  - name: from anniversary before start date
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:103
    billing_time: anniversary
    billing_at: 2022-05-02
    started_at: 2022-02-08
    want: {from: 2022-02-08}
  - name: from anniversary in the first quarter
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:111
    billing_time: anniversary
    billing_at: 2022-02-02
    want: {from: 2021-11-02}
  - name: from anniversary on the last day of the month
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:120
    billing_time: anniversary
    subscription_at: 2021-02-28
    billing_at: 2022-05-31
    want: {from: 2022-02-28}
  - name: from anniversary just terminated
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:130
    billing_time: anniversary
    billing_at: 2022-05-10
    terminated_at: 2022-05-09
    want: {from: 2022-05-02}
  - name: from anniversary just terminated in advance
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:137
    billing_time: anniversary
    pay_in_advance: true
    billing_at: 2022-05-10
    terminated_at: 2022-05-09
    want: {from: 2022-05-02}
  - name: from anniversary just terminated before the anniversary day
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:146
    billing_time: anniversary
    subscription_at: 2021-05-30
    billing_at: 2022-05-29
    terminated_at: 2022-05-09
    want: {from: 2022-02-28}
  - name: from anniversary just terminated in February
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:159
    billing_time: anniversary
    subscription_at: 2021-02-28
    billing_at: 2022-02-27
    terminated_at: 2022-02-25
    want: {from: 2021-11-28}
  - name: from anniversary in advance on the last day of a short month
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:171
    billing_time: anniversary
    pay_in_advance: true
    subscription_at: 2021-01-31
    billing_at: 2021-04-30
    want: {from: 2021-04-30}
  - name: from anniversary current usage outside a billing month
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:181
    billing_time: anniversary
    subscription_at: 2023-04-06
    billing_at: 2023-08-08
    current_usage: true
    want: {from: 2023-07-06}
  - name: from anniversary current usage outside a billing month before the anniversary day
    source: spec/services/subscriptions/dates/quarterly_service_spec.rb:191
    billing_time: anniversary
    subscription_at: 2023-04-06
    billing_at: 2023-08-04
    current_usage: true
    want: {from: 2023-07-06}

