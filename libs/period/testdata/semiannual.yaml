# Ported from lago spec/services/subscriptions/dates/semiannual_service_spec.rb.
# Periods are half-open: lago's "23:59:59" ends are the next midnight here.
defaults:
  interval: semiannual
  subscription_at: 2021-02-02
  timezone: UTC

cases:
  # from_datetime
  - name: from calendar is the beginning of the previous half year
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:36
    billing_time: calendar
    billing_at: 2022-07-01
    want: {from: 2022-01-01}
  - name: from calendar not started
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:43
    billing_time: calendar
    billing_at: 2022-07-01
    started_at: null
    want: {from: null}
  - name: from calendar with timezone
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:51
    billing_time: calendar
    billing_at: 2022-07-01
    timezone: America/New_York
    want: {from: 2021-07-01T04:00:00Z}
  - name: from calendar before start date
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:59
    billing_time: calendar
    billing_at: 2022-07-01
    started_at: 2022-04-07
    want: {from: 2022-04-07}
  - name: from calendar before start date with timezone
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:66
    billing_time: calendar
    billing_at: 2022-07-01
    started_at: 2022-04-07
    timezone: America/New_York
    want: {from: 2022-04-06T04:00:00Z}
  - name: from calendar just terminated
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:77
    billing_time: calendar
    billing_at: 2022-07-10
    terminated_at: 2022-07-09
    want: {from: 2022-07-01}
  - name: from calendar just terminated in advance
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:84
    billing_time: calendar
    pay_in_advance: true
    billing_at: 2022-07-10
    terminated_at: 2022-07-09
    want: {from: 2022-07-01}
  - name: from anniversary is the same day in the previous half year
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:96
    billing_time: anniversary
    subscription_at: 2021-11-02
    billing_at: 2022-05-02
    want: {from: 2021-11-02}
  - name: from anniversary before start date
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:103
    billing_time: anniversary
    subscription_at: 2021-11-02
    billing_at: 2022-05-02
    started_at: 2022-02-08
    want: {from: 2022-02-08}
  - name: from anniversary in the first half year
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:111
    billing_time: anniversary
    subscription_at: 2021-11-02
    billing_at: 2022-05-02
    want: {from: 2021-11-02}
  - name: from anniversary on the last day of the month
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:120
    billing_time: anniversary
    subscription_at: 2021-11-30
    billing_at: 2022-05-31
    want: {from: 2021-11-30}
  - name: from anniversary just terminated
    source: spec/services/subscriptions/dates/semiannual_service_spec.rb:130
