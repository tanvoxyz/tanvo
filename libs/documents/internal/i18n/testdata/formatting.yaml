# Formatting cases for every document locale. The expected values were
# produced by lago-api's own formatting code (MoneyHelper.format,
# format_with_precision and format_pricing_unit of app/views/helpers/money_helper.rb,
# DateHelper.format, and Addressing::DefaultFormatter as called by
# app/views/templates/invoices/v4/_customer_address.slim) run on the money
# 6.19.0, i18n 1.14.7 and addressing 1.1.0 gems with lago-api's
# config/locales and money-rails configuration (ROUND_HALF_UP).
# They extend the cases of spec/views/helpers/money_helper_spec.rb and
# spec/views/helpers/date_helper_spec.rb (source) to every locale and more
# currencies.
#
# The zh-CN rows are a Tanvo locale lago-api does not have
# (config/application.rb:49): they follow Unicode CLDR zh-Hans-CN (currency
# pattern "¤#,##0.00" with CLDR's zh symbols, the minus before the symbol;
# dates y年M月d日) and the addressing gem's zh-Hans formats.
