# Ported from lago-api 25b8b7b09: config/locales/fr/email.yml (email.payment_request)
fr:
  email:
    payment_request:
      requested:
        already_paid: Si vous avez déjà réglé ces factures, veuillez ignorer cet e-mail.
        hello: Bonjour %{customer_name},
        pay_amount: Payer le solde
        payment_terms:
          one: Nos conditions de paiement convenues contractuellement sont de %{count}
            jour.
          other: Nos conditions de paiement convenues contractuellement sont de %{count}
            jours.
          zero: Nos conditions de paiement définies contractuellement exigent le paiement
            à la création de la facture.
        remaining_amount: Montant restant à payer
        reminder_overdue_balance: Ceci est un rappel de l'équipe financière de %{billing_entity_name}
          que certaines de vos factures sont arrivées à échéance et non réglées.
        subject: Votre solde impayé pour %{billing_entity_name}
        thank_you: Merci.
        total_amount_due: Le montant total dû est de %{amount}.
