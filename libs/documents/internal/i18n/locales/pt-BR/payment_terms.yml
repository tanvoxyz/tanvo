# Ported from lago-api origin/feat-payment-terms-templates-changes (8ceddebb7): config/locales/pt-BR/invoice.yml (invoice.payment_terms)
pt-BR:
  invoice:
    payment_terms:
      day_of_month:
        following_month: Vencimento no dia %{day} do mês seguinte
        months_after: Vencimento no dia %{day}, %{months} meses após a fatura
        same_month: Vencimento no dia %{day} deste mês
      days_end_of_month:
        one: Pagamento em %{days} dia, fim do mês
        other: Pagamento em %{days} dias, fim do mês
      due_on_receipt: Vencimento no recebimento
      end_of_month: Vencimento no fim do mês
      net:
        one: Pagamento em até %{days} dia
        other: Pagamento em até %{days} dias
      net_end_of_month:
        one: Vencimento %{days} dia após o fim do mês
        other: Vencimento %{days} dias após o fim do mês
