# Ported from lago-api origin/feat-payment-terms-templates-changes (8ceddebb7): config/locales/sv/invoice.yml (invoice.payment_terms)
sv:
  invoice:
    payment_terms:
      day_of_month:
        following_month: Förfaller den %{day}:e följande månad
        months_after: Förfaller den %{day}:e, %{months} månader efter fakturan
        same_month: Förfaller den %{day}:e denna månad
      days_end_of_month:
        one: Betalning %{days} dag, månadens slut
        other: Betalning %{days} dagar, månadens slut
      due_on_receipt: Betalas vid mottagandet
      end_of_month: Betalas vid månadens slut
      net:
        one: Betalning inom %{days} dag
        other: Betalning inom %{days} dagar
      net_end_of_month:
        one: Betalas %{days} dag efter månadens slut
        other: Betalas %{days} dagar efter månadens slut
