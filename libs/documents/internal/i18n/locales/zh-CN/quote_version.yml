# Tanvo addition: lago-api has no zh-CN locale; mainland terms after
# config/locales/zh-TW/quote_version.yml (個月 is 个月).
---
zh-CN:
  quote_version:
    mention_variables:
      payment_terms: Net %{count}
      term_duration:
        days: "%{count}天"
        months: "%{count}个月"
        years: "%{count}年"
