  PaymentReceipt payment_receipt = 1;
}

// ListPaymentReceiptsRequest is the request of PaymentReceiptService.ListPaymentReceipts.
message ListPaymentReceiptsRequest {
  // The maximum number of results; 20 by default, at most 1000.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The next_page_token of the previous page.
  string page_token = 2 [(buf.validate.field).string.max_len = 1024];
  // An AIP-160 filter over `invoice_id`, `payment_id` and `customer_id`.
  string filter = 3 [(buf.validate.field).string.max_len = 2048];
