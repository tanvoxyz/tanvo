// ListPaymentReceiptsResponse is the response of PaymentReceiptService.ListPaymentReceipts.
message ListPaymentReceiptsResponse {
  // The receipts of this page.
  repeated PaymentReceipt payment_receipts = 1;
  // The token of the next page; empty on the last page.
  string next_page_token = 2;
}

// DownloadPaymentReceiptRequest is the request of PaymentReceiptService.DownloadPaymentReceipt.
message DownloadPaymentReceiptRequest {
  // The receipt's ID.
  string payment_receipt_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// DownloadPaymentReceiptResponse is the response of PaymentReceiptService.DownloadPaymentReceipt.
message DownloadPaymentReceiptResponse {
  // The PDF.
  tanvo.common.v1.Document pdf = 1;
  // The e-invoice XML, when the billing entity has e-invoicing.
  tanvo.common.v1.Document xml = 2;
}

// ResendPaymentReceiptRequest is the request of PaymentReceiptService.ResendPaymentReceipt.
message ResendPaymentReceiptRequest {
  // The receipt's ID.
  string payment_receipt_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The recipients; the customer's billing emails by default.
  repeated string to = 2 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {email: true}
    }
  }];
}

// ResendPaymentReceiptResponse is the response of PaymentReceiptService.ResendPaymentReceipt.
message ResendPaymentReceiptResponse {}
