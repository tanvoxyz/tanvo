    expression: "has(this.rate_card.rate_card_code)"
  };

  // The contract's external ID.
  string external_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255
  ];
  // The new values; rate_card.rate_card_code selects the contract rate
  // card.
  ContractRateCard rate_card = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
