edition = "2023";

// Package tanvo.x402.v1 is the API of x402 payments: stablecoin payments
// by AI agents over HTTP 402, settled through a facilitator to the
// organization's payout addresses.
package tanvo.x402.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "tanvo/common/v1/options.proto";
import "tanvo/common/v1/types.proto";

// X402ConnectionService manages x402 connections: the facilitator
// credentials, networks and payout addresses of x402 payments.
service X402ConnectionService {
  // Creates a connection.
  rpc CreateX402Connection(CreateX402ConnectionRequest) returns (CreateX402ConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/x402_connections"
      body: "x402_connection"
    };
    option (tanvo.common.v1.access) = {
      permission: "organization:integrations:create"
      api_resource: "x402_connection"
    };
  }

  // Returns a connection by ID or `code:<code>`.
  rpc GetX402Connection(GetX402ConnectionRequest) returns (GetX402ConnectionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/x402_connections/{x402_connection_id}"};
    option (tanvo.common.v1.access) = {
      permission: "organization:integrations:read"
      api_resource: "x402_connection"
    };
  }

  // Lists connections.
  rpc ListX402Connections(ListX402ConnectionsRequest) returns (ListX402ConnectionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/x402_connections"};
    option (tanvo.common.v1.access) = {
      permission: "organization:integrations:read"
      api_resource: "x402_connection"
    };
  }

  // Updates a connection.
  rpc UpdateX402Connection(UpdateX402ConnectionRequest) returns (UpdateX402ConnectionResponse) {
    option (google.api.http) = {
      patch: "/v1/x402_connections/{x402_connection.id}"
      body: "x402_connection"
    };
    option (tanvo.common.v1.access) = {
      permission: "organization:integrations:update"
      api_resource: "x402_connection"
    };
  }

  // Deletes a connection; settlements already made are kept.
  rpc DeleteX402Connection(DeleteX402ConnectionRequest) returns (DeleteX402ConnectionResponse) {
    option (google.api.http) = {delete: "/v1/x402_connections/{x402_connection_id}"};
    option (tanvo.common.v1.access) = {
      permission: "organization:integrations:delete"
      api_resource: "x402_connection"
    };
  }
}

// X402Service serves the x402 flow of a resource server (the
// organization's API gateway): checking an agent's access before a call.
service X402Service {
  // Checks whether an agent may call a resource: returns its wallet
  // balance and, when it must pay first, the x402 payment requirements to
  // answer with HTTP 402. Creates the customer, subscription and wallet of
  // a new agent when the connection auto-creates customers.
  rpc CheckX402Gate(CheckX402GateRequest) returns (CheckX402GateResponse) {
    option (google.api.http) = {
      post: "/v1/x402/gate_checks"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      authenticated: true
      api_resource: "x402"
    };
  }

  // Lists settlements, newest first.
  rpc ListX402Settlements(ListX402SettlementsRequest) returns (ListX402SettlementsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/x402/settlements"};
    option (tanvo.common.v1.access) = {
      permission: "payments:read"
      api_resource: "x402"
    };
  }
}

// X402Facilitator is the service verifying and settling x402 payments.
enum X402Facilitator {
  // Not set.
  X402_FACILITATOR_UNSPECIFIED = 0;
  // The Coinbase Developer Platform facilitator.
  X402_FACILITATOR_COINBASE_CDP = 1;
}

// X402Network is a blockchain network, identified as a CAIP-2 chain.
enum X402Network {
  // Not set.
  X402_NETWORK_UNSPECIFIED = 0;
  // Base mainnet (`eip155:8453`).
  X402_NETWORK_BASE = 1;
  // Base Sepolia testnet (`eip155:84532`).
  X402_NETWORK_BASE_SEPOLIA = 2;
  // Solana mainnet.
  X402_NETWORK_SOLANA = 3;
  // Solana devnet.
  X402_NETWORK_SOLANA_DEVNET = 4;
}

// X402Asset is the token paid.
enum X402Asset {
  // Not set.
  X402_ASSET_UNSPECIFIED = 0;
  // USD Coin.
  X402_ASSET_USDC = 1;
}

// X402SettlementKind is what a settlement paid for.
enum X402SettlementKind {
  // Not set.
  X402_SETTLEMENT_KIND_UNSPECIFIED = 0;
  // Wallet credits.
  X402_SETTLEMENT_KIND_CREDIT_PURCHASE = 1;
  // An invoice.
  X402_SETTLEMENT_KIND_INVOICE_PAYMENT = 2;
}

// X402SettlementStatus is the state of a settlement.
enum X402SettlementStatus {
  // Not set.
  X402_SETTLEMENT_STATUS_UNSPECIFIED = 0;
  // Submitted to the facilitator.
  X402_SETTLEMENT_STATUS_PENDING = 1;
  // Settled on chain.
  X402_SETTLEMENT_STATUS_SETTLED = 2;
  // Failed.
  X402_SETTLEMENT_STATUS_FAILED = 3;
}

// X402PayoutAddress is where payments on one network are paid.
message X402PayoutAddress {
  // The network.
  X402Network network = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The address: `0x` and 40 hex digits on EVM networks, base58 on Solana.
  string address = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^(0x[0-9a-fA-F]{40}|[1-9A-HJ-NP-Za-km-z]{32,44})$"
  ];
}

// X402Connection configures x402 payments.
message X402Connection {
  option (google.api.resource) = {
    type: "tanvo.xyz/X402Connection"
    pattern: "x402_connections/{x402_connection}"
    plural: "x402Connections"
    singular: "x402Connection"
  };

  // The connection's ID.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The unique code.
  string code = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (buf.validate.field).string.(tanvo.common.v1.code) = true
  ];
  // The display name.
  string name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];
  // The facilitator; COINBASE_CDP by default.
  X402Facilitator facilitator = 4 [(buf.validate.field).enum.defined_only = true];
  // The facilitator's API key ID.
  string facilitator_api_key_id = 5 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 255
  ];
  // The facilitator's API key secret.
  string facilitator_api_key_secret = 6 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 4096
  ];
  // The networks accepted.
  repeated X402Network networks = 7 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      unique: true
      max_items: 4
      items: {
        enum: {defined_only: true}
      }
    }
  ];
  // The token paid; USDC by default.
  X402Asset asset = 8 [(buf.validate.field).enum.defined_only = true];
  // The payout addresses: one per network accepted.
  repeated X402PayoutAddress payout_addresses = 9 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.max_items = 4
  ];
  // Creates a customer, subscription and wallet for an unknown agent;
  // true by default.
  bool auto_create_customers = 10;
  // When the connection was created.
  google.protobuf.Timestamp created_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the connection last changed.
  google.protobuf.Timestamp updated_at = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// X402Settlement is one x402 payment.
message X402Settlement {
  // The settlement's ID.
  string id = 1;
  // The connection.
  string x402_connection_id = 2;
  // What it paid for.
  X402SettlementKind kind = 3;
  // The state.
  X402SettlementStatus status = 4;
  // The network.
  X402Network network = 5;
  // The token.
  X402Asset asset = 6;
  // The payer's address.
  string payer_address = 7;
  // The payee's address.
  string payee_address = 8;
  // The transaction hash or signature.
  string payment_digest = 9;
  // The amount in the token's smallest unit.
  string settled_amount_atomic = 10;
  // The amount in the customer's currency.
  tanvo.common.v1.Money settled_amount = 11;
  // The customer.
  string customer_id = 12;
  // The wallet transaction, for CREDIT_PURCHASE.
  string wallet_transaction_id = 13;
  // The invoice, for INVOICE_PAYMENT.
  string invoice_id = 14;
  // The payment.
  string payment_id = 15;
  // Why it failed.
  string error_reason = 16;
  // When it was created.
  google.protobuf.Timestamp created_at = 17;
}

// CreateX402ConnectionRequest is the request of X402ConnectionService.CreateX402Connection.
message CreateX402ConnectionRequest {
  option (buf.validate.message).cel = {
    id: "x402_connection.required"
    message: "code, name, facilitator credentials, networks and payout_addresses are required"
    expression: "has(this.x402_connection.code) && has(this.x402_connection.name) && has(this.x402_connection.facilitator_api_key_id) && has(this.x402_connection.facilitator_api_key_secret) && size(this.x402_connection.networks) > 0 && size(this.x402_connection.payout_addresses) > 0"
  };

  // The connection to create.
  X402Connection x402_connection = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// CreateX402ConnectionResponse is the response of X402ConnectionService.CreateX402Connection.
message CreateX402ConnectionResponse {
  // The created connection.
  X402Connection x402_connection = 1;
}

// GetX402ConnectionRequest is the request of X402ConnectionService.GetX402Connection.
message GetX402ConnectionRequest {
  // The connection's ID or `code:<code>`.
  string x402_connection_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.(tanvo.common.v1.ref) = true
  ];
}

// GetX402ConnectionResponse is the response of X402ConnectionService.GetX402Connection.
message GetX402ConnectionResponse {
  // The connection.
  X402Connection x402_connection = 1;
}

// ListX402ConnectionsRequest is the request of X402ConnectionService.ListX402Connections.
message ListX402ConnectionsRequest {
  // The maximum number of results; 20 by default, at most 1000.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The next_page_token of the previous page.
  string page_token = 2 [(buf.validate.field).string.max_len = 1024];
}

// ListX402ConnectionsResponse is the response of X402ConnectionService.ListX402Connections.
message ListX402ConnectionsResponse {
  // The connections of this page.
  repeated X402Connection x402_connections = 1;
  // The token of the next page; empty on the last page.
  string next_page_token = 2;
}

// UpdateX402ConnectionRequest is the request of X402ConnectionService.UpdateX402Connection.
message UpdateX402ConnectionRequest {
  option (buf.validate.message).cel = {
    id: "x402_connection.id"
    message: "x402_connection.id is required"
    expression: "has(this.x402_connection.id)"
  };

  // The new values; x402_connection.id (an ID or `code:<code>`) selects
  // the connection.
  X402Connection x402_connection = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  // The fields to update; empty updates every field that is set.
  google.protobuf.FieldMask update_mask = 2;
}

// UpdateX402ConnectionResponse is the response of X402ConnectionService.UpdateX402Connection.
message UpdateX402ConnectionResponse {
  // The updated connection.
  X402Connection x402_connection = 1;
}

// DeleteX402ConnectionRequest is the request of X402ConnectionService.DeleteX402Connection.
message DeleteX402ConnectionRequest {
  // The connection's ID or `code:<code>`.
  string x402_connection_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.(tanvo.common.v1.ref) = true
  ];
}

// DeleteX402ConnectionResponse is the response of X402ConnectionService.DeleteX402Connection.
message DeleteX402ConnectionResponse {}

// CheckX402GateRequest is the request of X402Service.CheckX402Gate.
message CheckX402GateRequest {
  // The connection's code.
  string connection_code = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.(tanvo.common.v1.code) = true
  ];
  // The agent's wallet address; it identifies the customer.
  string agent_address = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^(0x[0-9a-fA-F]{40}|[1-9A-HJ-NP-Za-km-z]{32,44})$"
  ];
  // The resource called (its URL).
  string resource = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 2048
  ];
  // The plan of an auto-created subscription.
  string plan_code = 4 [(buf.validate.field).string.(tanvo.common.v1.code) = true];
  // The wallet to check, by code; the customer's default by default.
  string wallet_code = 5 [(buf.validate.field).string.(tanvo.common.v1.code) = true];
  // The billable metric metering the call.
  string metric_code = 6 [(buf.validate.field).string.(tanvo.common.v1.code) = true];
  // The top-up amount required when the balance is short.
  tanvo.common.v1.Money amount = 7;
  // The estimated cost of the call; the balance must cover it.
  tanvo.common.v1.Money estimated_call_cost = 8;
}

// CheckX402GateResponse is the response of X402Service.CheckX402Gate.
message CheckX402GateResponse {
  // The wallet's balance in credits.
  string balance_credits = 1;
  // The x402 payment requirements when the agent must pay first; empty
  // when it may proceed.
  google.protobuf.Struct requirements = 2;
  // The agent's subscription, to send events to.
  string external_subscription_id = 3;
}

// ListX402SettlementsRequest is the request of X402Service.ListX402Settlements.
message ListX402SettlementsRequest {
  // The maximum number of results; 20 by default, at most 1000.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The next_page_token of the previous page.
  string page_token = 2 [(buf.validate.field).string.max_len = 1024];
  // An AIP-160 filter over `x402_connection_id`, `customer_id`, `kind`,
  // `status` and `network`.
  string filter = 3 [(buf.validate.field).string.max_len = 2048];
}

// ListX402SettlementsResponse is the response of X402Service.ListX402Settlements.
message ListX402SettlementsResponse {
  // The settlements of this page.
  repeated X402Settlement settlements = 1;
  // The token of the next page; empty on the last page.
  string next_page_token = 2;
}
