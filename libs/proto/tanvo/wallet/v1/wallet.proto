// ListWalletTransactionsRequest is the request of WalletService.ListWalletTransactions.
message ListWalletTransactionsRequest {
  // The wallet's ID.
  string wallet_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The maximum number of results; 20 by default, at most 1000.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The next_page_token of the previous page.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
  // An AIP-160 filter over `transaction_type`, `transaction_status`,
  // `status` and `invoice_id`.
  string filter = 4 [(buf.validate.field).string.max_len = 2048];
}

// ListWalletTransactionsResponse is the response of WalletService.ListWalletTransactions.
message ListWalletTransactionsResponse {
  // The transactions of this page.
  repeated WalletTransaction wallet_transactions = 1;
  // The token of the next page; empty on the last page.
  string next_page_token = 2;
}

