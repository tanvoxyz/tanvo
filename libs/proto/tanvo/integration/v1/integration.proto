edition = "2023";

// Package tanvo.integration.v1 is the API of connections to payment,
// accounting, tax and CRM providers, and of their item mappings.
// Single sign-on connections are in tanvo.access.v1.SsoConnectionService.
package tanvo.integration.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "tanvo/common/v1/options.proto";
import "tanvo/common/v1/types.proto";
import "tanvo/customer/v1/customer.proto";
import "tanvo/invoice/v1/invoice.proto";

// IntegrationService manages integrations. An organization may connect a
// provider several times; integrations are addressed by ID or
// `code:<code>`.
service IntegrationService {
  // Connects a provider. Providers connected by OAuth are completed with
  // CompleteIntegrationOauth.
  rpc CreateIntegration(CreateIntegrationRequest) returns (CreateIntegrationResponse) {
    option (google.api.http) = {
      post: "/v1/integrations"
      body: "integration"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:create"};
  }

  // Returns an integration.
  rpc GetIntegration(GetIntegrationRequest) returns (GetIntegrationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/integrations/{integration_id}"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:read"};
  }

  // Lists integrations.
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/integrations"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:read"};
  }

  // Updates an integration's code, name, sync settings or credentials.
  rpc UpdateIntegration(UpdateIntegrationRequest) returns (UpdateIntegrationResponse) {
    option (google.api.http) = {
      patch: "/v1/integrations/{integration.id}"
      body: "integration"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Disconnects a provider. Payment providers are discarded and their
  // customers unlinked; other integrations are removed with their mappings
  // and synced records.
  rpc DeleteIntegration(DeleteIntegrationRequest) returns (DeleteIntegrationResponse) {
    option (google.api.http) = {delete: "/v1/integrations/{integration_id}"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:delete"};
  }

  // Returns the provider's authorization URL of an OAuth integration.
  rpc StartIntegrationOauth(StartIntegrationOauthRequest) returns (StartIntegrationOauthResponse) {
    option (google.api.http) = {
      post: "/v1/integrations/{integration_id}:start_oauth"
      body: "*"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Exchanges the provider's authorization code and activates the
  // integration.
  rpc CompleteIntegrationOauth(CompleteIntegrationOauthRequest) returns (CompleteIntegrationOauthResponse) {
    option (google.api.http) = {
      post: "/v1/integrations/{integration_id}:complete_oauth"
      body: "*"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Fetches the provider's items, tax items, accounts or subsidiaries again.
  rpc SyncIntegrationItems(SyncIntegrationItemsRequest) returns (SyncIntegrationItemsResponse) {
    option (google.api.http) = {
      post: "/v1/integrations/{integration_id}:sync_items"
      body: "*"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Lists the provider items fetched.
  rpc ListIntegrationItems(ListIntegrationItemsRequest) returns (ListIntegrationItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/integrations/{integration_id}/items"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:read"};
  }

  // Lists the provider's subsidiaries (NetSuite).
  rpc ListIntegrationSubsidiaries(ListIntegrationSubsidiariesRequest) returns (ListIntegrationSubsidiariesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/integrations/{integration_id}/subsidiaries"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:read"};
  }

  // Lists the item mappings of add-ons and billable metrics.
  rpc ListIntegrationMappings(ListIntegrationMappingsRequest) returns (ListIntegrationMappingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/integrations/{integration_id}/mappings"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:read"};
  }

  // Creates the mapping of an add-on or billable metric, optionally for
  // one billing entity; there is one per object and billing entity.
  rpc CreateIntegrationMapping(CreateIntegrationMappingRequest) returns (CreateIntegrationMappingResponse) {
    option (google.api.http) = {
      post: "/v1/integrations/{integration_id}/mappings"
      body: "mapping"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Updates the external item of a mapping.
  rpc UpdateIntegrationMapping(UpdateIntegrationMappingRequest) returns (UpdateIntegrationMappingResponse) {
    option (google.api.http) = {
      patch: "/v1/integrations/{integration_id}/mappings/{mapping.id}"
      body: "mapping"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Deletes a mapping.
  rpc DeleteIntegrationMapping(DeleteIntegrationMappingRequest) returns (DeleteIntegrationMappingResponse) {
    option (google.api.http) = {delete: "/v1/integrations/{integration_id}/mappings/{mapping_id}"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Lists the collection mappings: the items used for fees with no own
  // mapping, coupons, taxes, credits and currencies.
  rpc ListCollectionMappings(ListCollectionMappingsRequest) returns (ListCollectionMappingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/integrations/{integration_id}/collection_mappings"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:read"};
  }

  // Creates a collection mapping, optionally for one billing entity;
  // there is one per type and billing entity.
  rpc CreateCollectionMapping(CreateCollectionMappingRequest) returns (CreateCollectionMappingResponse) {
    option (google.api.http) = {
      post: "/v1/integrations/{integration_id}/collection_mappings"
      body: "collection_mapping"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Updates the external values of a collection mapping.
  rpc UpdateCollectionMapping(UpdateCollectionMappingRequest) returns (UpdateCollectionMappingResponse) {
    option (google.api.http) = {
      patch: "/v1/integrations/{integration_id}/collection_mappings/{collection_mapping.id}"
      body: "collection_mapping"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Deletes a collection mapping.
  rpc DeleteCollectionMapping(DeleteCollectionMappingRequest) returns (DeleteCollectionMappingResponse) {
    option (google.api.http) = {delete: "/v1/integrations/{integration_id}/collection_mappings/{collection_mapping_id}"};
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Queues the creation of an invoice's record in the customer's HubSpot
  // portal.
  rpc SyncHubspotInvoice(SyncHubspotInvoiceRequest) returns (SyncHubspotInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:sync_hubspot"
      body: "*"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Emits the invoice.resynced webhook of an invoice, which the Salesforce
  // package listens to.
  rpc SyncSalesforceInvoice(SyncSalesforceInvoiceRequest) returns (SyncSalesforceInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:sync_salesforce"
      body: "*"
    };
    option (tanvo.common.v1.access) = {permission: "organization:integrations:update"};
  }

  // Asks the customer's tax provider for the taxes of a one-off invoice
  // not created yet, issued today. Nothing is stored. The list is empty
  // for a customer taxed by no provider; a provider's refusal fails with
  // the provider's code on tax_error.
  rpc PreviewInvoiceTaxes(PreviewInvoiceTaxesRequest) returns (PreviewInvoiceTaxesResponse) {
    option (google.api.http) = {
      post: "/v1/invoices:preview_taxes"
      body: "*"
    };
    option (tanvo.common.v1.access) = {permission: "invoices:create"};
  }
}

// IntegrationProvider is the provider of an integration.
enum IntegrationProvider {
  // Not set.
  INTEGRATION_PROVIDER_UNSPECIFIED = 0;
  // Stripe (payment).
  INTEGRATION_PROVIDER_STRIPE = 1;
  // Adyen (payment).
  INTEGRATION_PROVIDER_ADYEN = 2;
  // GoCardless (payment).
  INTEGRATION_PROVIDER_GOCARDLESS = 3;
  // Cashfree (payment).
  INTEGRATION_PROVIDER_CASHFREE = 4;
  // Moneyhash (payment).
  INTEGRATION_PROVIDER_MONEYHASH = 5;
  // Flutterwave (payment).
  INTEGRATION_PROVIDER_FLUTTERWAVE = 6;
  // NetSuite (accounting).
  INTEGRATION_PROVIDER_NETSUITE = 7;
  // Xero (accounting).
  INTEGRATION_PROVIDER_XERO = 8;
  // Anrok (tax).
  INTEGRATION_PROVIDER_ANROK = 9;
  // Avalara (tax).
  INTEGRATION_PROVIDER_AVALARA = 10;
  // HubSpot (CRM).
  INTEGRATION_PROVIDER_HUBSPOT = 11;
  // Salesforce (CRM).
  INTEGRATION_PROVIDER_SALESFORCE = 12;
}

// MappableType is the kind of object an item mapping maps.
enum MappableType {
  // Not set.
  MAPPABLE_TYPE_UNSPECIFIED = 0;
  // An add-on.
  MAPPABLE_TYPE_ADD_ON = 1;
  // A billable metric.
  MAPPABLE_TYPE_BILLABLE_METRIC = 2;
}

// CollectionMappingType is the collection a collection mapping maps.
enum CollectionMappingType {
  // Not set.
  COLLECTION_MAPPING_TYPE_UNSPECIFIED = 0;
  // Fees with no own mapping.
  COLLECTION_MAPPING_TYPE_FALLBACK_ITEM = 1;
  // Coupons.
  COLLECTION_MAPPING_TYPE_COUPON = 2;
  // Subscription fees.
  COLLECTION_MAPPING_TYPE_SUBSCRIPTION_FEE = 3;
  // Minimum commitment true-ups.
  COLLECTION_MAPPING_TYPE_MINIMUM_COMMITMENT = 4;
  // Taxes.
  COLLECTION_MAPPING_TYPE_TAX = 5;
  // Prepaid credits.
  COLLECTION_MAPPING_TYPE_PREPAID_CREDIT = 6;
  // Credit notes.
  COLLECTION_MAPPING_TYPE_CREDIT_NOTE = 7;
  // The account payments are booked to.
  COLLECTION_MAPPING_TYPE_ACCOUNT = 8;
  // Currency codes of the provider.
  COLLECTION_MAPPING_TYPE_CURRENCIES = 9;
}

// IntegrationItemType is the kind of a provider item.
enum IntegrationItemType {
  // Not set.
  INTEGRATION_ITEM_TYPE_UNSPECIFIED = 0;
  // A product or service item.
  INTEGRATION_ITEM_TYPE_STANDARD = 1;
  // A tax item.
  INTEGRATION_ITEM_TYPE_TAX = 2;
  // An account.
  INTEGRATION_ITEM_TYPE_ACCOUNT = 3;
}

// HubspotTargetedObject is the HubSpot object customers become.
enum HubspotTargetedObject {
  // Not set.
  HUBSPOT_TARGETED_OBJECT_UNSPECIFIED = 0;
  // Companies.
  HUBSPOT_TARGETED_OBJECT_COMPANIES = 1;
  // Contacts.
  HUBSPOT_TARGETED_OBJECT_CONTACTS = 2;
}

// StripeSettings connects Stripe.
message StripeSettings {
  // The secret API key; write only.
  string secret_key = 1 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 255
  ];
  // The URL customers return to after checkout.
  string success_redirect_url = 2 [(buf.validate.field).string = {
    uri: true
    max_len: 1024
  }];
  // Authenticates card payments with 3-D Secure.
  bool supports_3ds = 4;
  // Asks customers to accept the terms of service at checkout.
  bool require_terms_of_service_consent = 5;

  reserved 3;
  reserved webhook_endpoint_id;
}

// AdyenSettings connects Adyen.
message AdyenSettings {
  // The API key; write only.
  string api_key = 1 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The merchant account.
  string merchant_account = 2 [(buf.validate.field).string.max_len = 255];
  // The live URL prefix; empty for the test environment.
  string live_prefix = 3 [(buf.validate.field).string.max_len = 255];
  // The HMAC key of notifications; write only.
  string hmac_key = 4 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The URL customers return to after checkout.
  string success_redirect_url = 5 [(buf.validate.field).string = {
    uri: true
    max_len: 1024
  }];
}

// GocardlessSettings connects GoCardless by OAuth.
message GocardlessSettings {
  // The URL customers return to after the mandate setup.
  string success_redirect_url = 1 [(buf.validate.field).string = {
    uri: true
    max_len: 1024
  }];
  // The secret Tanvo generates for the GoCardless webhook endpoint, which
  // signs the webhooks GoCardless sends.
  string webhook_secret = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CashfreeSettings connects Cashfree.
message CashfreeSettings {
  // The client ID.
  string client_id = 1 [(buf.validate.field).string.max_len = 255];
  // The client secret; write only.
  string client_secret = 2 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The URL customers return to after payment.
  string success_redirect_url = 3 [(buf.validate.field).string = {
    uri: true
    max_len: 1024
  }];
}

// MoneyhashSettings connects Moneyhash.
message MoneyhashSettings {
  // The API key; write only.
  string api_key = 1 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The checkout flow ID.
  string flow_id = 2 [(buf.validate.field).string.max_len = 255];
}

// FlutterwaveSettings connects Flutterwave.
message FlutterwaveSettings {
  // The secret key; write only.
  string secret_key = 1 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The secret Tanvo generates for the Flutterwave dashboard's webhook
  // secret hash, which signs the webhooks Flutterwave sends.
  string webhook_secret = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The URL customers return to after payment.
  string success_redirect_url = 3 [(buf.validate.field).string = {
    uri: true
    max_len: 1024
  }];
}

// NetsuiteSettings connects NetSuite with token-based authentication.
message NetsuiteSettings {
  // The account ID.
  string account_id = 1 [(buf.validate.field).string.max_len = 255];
  // The consumer key.
  string client_id = 2 [(buf.validate.field).string.max_len = 255];
  // The consumer secret; write only.
  string client_secret = 3 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The token ID.
  string token_id = 4 [(buf.validate.field).string.max_len = 255];
  // The token secret; write only.
  string token_secret = 5 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The RESTlet endpoint URL.
  string script_endpoint_url = 6 [(buf.validate.field).string = {
    uri: true
    max_len: 1024
  }];
}

// XeroSettings connects Xero by OAuth.
message XeroSettings {
  reserved 1;
  reserved tenant_id;
}

// AnrokSettings connects Anrok.
message AnrokSettings {
  // The API key; write only.
  string api_key = 1 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The seller account ID: the API key's part before its slash.
  string external_account_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AvalaraSettings connects Avalara.
message AvalaraSettings {
  // The account ID.
  string account_id = 1 [(buf.validate.field).string.max_len = 255];
  // The license key; write only.
  string license_key = 2 [
    (google.api.field_behavior) = INPUT_ONLY,
    (buf.validate.field).string.max_len = 1024
  ];
  // The company code.
  string company_code = 3 [(buf.validate.field).string.max_len = 255];
  // The company ID looked up from the code.
  string company_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// HubspotSettings connects HubSpot by OAuth.
message HubspotSettings {
  // The object customers are synced to.
  HubspotTargetedObject default_targeted_object = 1 [(buf.validate.field).enum.defined_only = true];
  // The HubSpot portal connected.
  string portal_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The object type ID of the deployed custom invoice object.
  string invoices_object_type_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The object type ID of the deployed custom subscription object.
  string subscriptions_object_type_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SalesforceSettings connects Salesforce.
message SalesforceSettings {
  // The Salesforce instance ID.
  string instance_id = 1 [(buf.validate.field).string.max_len = 255];
}

// Integration is a connection to a provider.
message Integration {
  option (google.api.resource) = {
    type: "tanvo.xyz/Integration"
    pattern: "integrations/{integration}"
    plural: "integrations"
    singular: "integration"
  };

  // The integration's ID.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The unique code.
  string code = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.(tanvo.common.v1.code) = true
  ];
  // The display name.
  string name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];
  // The provider.
  IntegrationProvider provider = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The family.
  tanvo.customer.v1.IntegrationCategory category = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Syncs finalized invoices.
  bool sync_invoices = 8;
  // Syncs credit notes.
  bool sync_credit_notes = 9;
  // Syncs payments.
  bool sync_payments = 10;
  // Syncs subscriptions (CRM).
  bool sync_subscriptions = 11;
  // The provider settings and credentials.
  oneof settings {
    // Stripe.
    StripeSettings stripe = 20;
    // Adyen.
    AdyenSettings adyen = 21;
    // GoCardless.
    GocardlessSettings gocardless = 22;
    // Cashfree.
    CashfreeSettings cashfree = 23;
    // Moneyhash.
    MoneyhashSettings moneyhash = 24;
    // Flutterwave.
    FlutterwaveSettings flutterwave = 25;
    // NetSuite.
    NetsuiteSettings netsuite = 26;
    // Xero.
    XeroSettings xero = 27;
    // Anrok.
    AnrokSettings anrok = 28;
    // Avalara.
    AvalaraSettings avalara = 29;
    // HubSpot.
    HubspotSettings hubspot = 30;
    // Salesforce.
    SalesforceSettings salesforce = 31;
  }
  // When the integration was created.
  google.protobuf.Timestamp created_at = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the integration last changed.
  google.protobuf.Timestamp updated_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  reserved 6, 7, 12, 13;
  reserved status, is_default, webhook_url, last_error;
}

// IntegrationItem is an item, tax item or account of a provider.
message IntegrationItem {
  // The item's ID in Tanvo.
  string id = 1;
  // The kind.
  IntegrationItemType item_type = 2;
  // The provider's ID.
  string external_id = 3;
  // The provider's account code.
  string external_account_code = 4;
  // The provider's name.
  string external_name = 5;
}

// IntegrationSubsidiary is a NetSuite subsidiary.
message IntegrationSubsidiary {
  // The subsidiary's ID.
  string external_id = 1;
  // The subsidiary's name.
  string external_name = 2;
}

// IntegrationMapping maps an add-on or billable metric to a provider item.
message IntegrationMapping {
  // The mapping's ID.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The kind of object mapped.
  MappableType mappable_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum.defined_only = true
  ];
  // The add-on or billable metric (ID or `code:<code>`).
  string mappable_id = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.(tanvo.common.v1.ref) = true
  ];
  // Restricts the mapping to one billing entity (ID or `code:<code>`).
  string billing_entity_id = 4 [(buf.validate.field).string.(tanvo.common.v1.ref) = true];
  // The provider's item ID.
  string external_id = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 255
  ];
  // The provider's account code.
  string external_account_code = 6 [(buf.validate.field).string.max_len = 255];
  // The provider's item name.
  string external_name = 7 [(buf.validate.field).string.max_len = 255];
}

// CollectionMapping maps a collection to a provider item.
message CollectionMapping {
  // The mapping's ID.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The collection mapped.
  CollectionMappingType mapping_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum.defined_only = true
  ];
  // Restricts the mapping to one billing entity (ID or `code:<code>`).
  string billing_entity_id = 3 [(buf.validate.field).string.(tanvo.common.v1.ref) = true];
  // The provider's item ID.
  string external_id = 4 [(buf.validate.field).string.max_len = 255];
  // The provider's account code.
  string external_account_code = 5 [(buf.validate.field).string.max_len = 255];
  // The provider's item name.
  string external_name = 6 [(buf.validate.field).string.max_len = 255];
  // The NetSuite tax nexus, for TAX.
  string tax_nexus = 7 [(buf.validate.field).string.max_len = 255];
  // The NetSuite tax type, for TAX.
  string tax_type = 8 [(buf.validate.field).string.max_len = 255];
  // The NetSuite tax code, for TAX.
  string tax_code = 9 [(buf.validate.field).string.max_len = 255];
  // The provider's currency IDs keyed by ISO code, for CURRENCIES.
  map<string, string> currencies = 10 [(buf.validate.field).map = {
    max_pairs: 200
    keys: {
      string: {[tanvo.common.v1.currency]: true}
    }
  }];
}

// CreateIntegrationRequest is the request of IntegrationService.CreateIntegration.
message CreateIntegrationRequest {
  option (buf.validate.message).cel = {
    id: "integration.required"
    message: "code, name and the provider settings are required"
    expression: "has(this.integration.code) && has(this.integration.name) && (has(this.integration.stripe) || has(this.integration.adyen) || has(this.integration.gocardless) || has(this.integration.cashfree) || has(this.integration.moneyhash) || has(this.integration.flutterwave) || has(this.integration.netsuite) || has(this.integration.xero) || has(this.integration.anrok) || has(this.integration.avalara) || has(this.integration.hubspot) || has(this.integration.salesforce))"
  };

  // The integration to create; the settings field chooses the provider.
  Integration integration = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// CreateIntegrationResponse is the response of IntegrationService.CreateIntegration.
message CreateIntegrationResponse {
  // The created integration.
  Integration integration = 1;
}

// GetIntegrationRequest is the request of IntegrationService.GetIntegration.
message GetIntegrationRequest {
  // The integration's ID or `code:<code>`.
  string integration_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.(tanvo.common.v1.ref) = true
  ];
}

// GetIntegrationResponse is the response of IntegrationService.GetIntegration.
message GetIntegrationResponse {
  // The integration.
  Integration integration = 1;
}

// ListIntegrationsRequest is the request of IntegrationService.ListIntegrations.
message ListIntegrationsRequest {
