// PreviewInvoiceRequest is the request of InvoiceService.PreviewInvoice.
message PreviewInvoiceRequest {
  option (buf.validate.message).cel = {
    id: "preview.target"
    message: "set at most one of subscription, terminated_at and plan_id"
    expression: "(has(this.subscription) ? 1 : 0) + (has(this.terminated_at) ? 1 : 0) + (has(this.plan_id) ? 1 : 0) <= 1"
  };

  // The customer (ID or `external_id:<external_id>`); a customer that
  // does not exist yet when unset, which only a new subscription can
  // preview.
  string customer_id = 1 [(buf.validate.field).string.(tanvo.common.v1.ref) = true];
  // Previews a new subscription.
  PreviewSubscription subscription = 2;
  // The existing subscriptions to preview (IDs or
  // `external_id:<external_id>`).
  repeated string subscription_ids = 3 [(buf.validate.field).repeated = {
    unique: true
    max_items: 50
    items: {
      string: {[tanvo.common.v1.ref]: true}
    }
  }];
  // Previews the termination of subscription_ids at this time.
  google.protobuf.Timestamp terminated_at = 4;
  // Previews the change of subscription_ids to this plan (ID or
  // `code:<code>`).
  string plan_id = 5 [(buf.validate.field).string.(tanvo.common.v1.ref) = true];
  // Coupons to apply (IDs or `code:<code>`).
  repeated string coupon_ids = 6 [(buf.validate.field).repeated = {
    unique: true
    max_items: 20
    items: {
      string: {[tanvo.common.v1.ref]: true}
    }
  }];
  // The billing entity (ID or `code:<code>`).
  string billing_entity_id = 7 [(buf.validate.field).string.(tanvo.common.v1.ref) = true];
  // Customer attributes that override the stored ones for the preview.
  PreviewCustomer customer = 8;
  // Coupons to apply, given by their attributes: a coupon whose code
  // exists is that coupon, any other is built from the attributes and
  // applies only when they describe a valid coupon. They follow
  // coupon_ids and apply when the customer has no active coupon.
  repeated tanvo.coupon.v1.Coupon coupons = 9 [(buf.validate.field).repeated.max_items = 20];
}

// PreviewCustomer holds the customer attributes of a preview; unset
// fields keep the stored value.
message PreviewCustomer {
  // The name.
  string name = 1 [(buf.validate.field).string.max_len = 255];
  // The tax identification number.
  string tax_identification_number = 2 [(buf.validate.field).string.max_len = 255];
  // The ISO 4217 currency.
  string currency = 3 [(buf.validate.field).string.(tanvo.common.v1.currency) = true];
  // The IANA time zone.
  string timezone = 4 [(buf.validate.field).string.max_len = 64];
  // The billing address; set fields replace the stored ones.
  tanvo.common.v1.Address billing_address = 5;
  // The shipping address; set fields replace the stored ones.
  tanvo.common.v1.Address shipping_address = 6;
  // Integrations that sync the customer (anrok, avalara, xero, hubspot or
  // salesforce), added to the stored ones.
  repeated PreviewIntegrationCustomer integration_customers = 7 [(buf.validate.field).repeated.max_items = 10];
}

// PreviewIntegrationCustomer links the customer of a preview to an
// integration.
message PreviewIntegrationCustomer {
  // The integration (ID or `code:<code>`).
  string integration_id = 1 [
    (google.api.field_behavior) = REQUIRED,
