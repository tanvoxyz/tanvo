edition = "2023";

// Package tanvo.invoice.v1 is the API of invoices, their fees and invoice
// custom sections.
package tanvo.invoice.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "tanvo/common/v1/enums.proto";
import "tanvo/common/v1/options.proto";
import "tanvo/common/v1/types.proto";
import "tanvo/coupon/v1/coupon.proto";

// InvoiceService manages invoices.
service InvoiceService {
  // Creates a one-off invoice of add-on fees, finalized at once.
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:create"
      api_resource: "invoice"
    };
  }

  // Returns an invoice.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/invoices/{invoice_id}"};
    option (tanvo.common.v1.access) = {
      permission: "invoices:read"
      api_resource: "invoice"
    };
  }

  // Lists invoices, newest first.
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/invoices"
      additional_bindings: {get: "/v1/customers/{customer_id}/invoices"}
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:read"
      api_resource: "invoice"
    };
  }

  // Updates an invoice's payment status, metadata or item metadata.
  rpc UpdateInvoice(UpdateInvoiceRequest) returns (UpdateInvoiceResponse) {
    option (google.api.http) = {
      patch: "/v1/invoices/{invoice.id}"
      body: "invoice"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Deletes a draft invoice.
  rpc DeleteInvoice(DeleteInvoiceRequest) returns (DeleteInvoiceResponse) {
    option (google.api.http) = {delete: "/v1/invoices/{invoice_id}"};
    option (tanvo.common.v1.access) = {
      permission: "invoices:delete"
      api_resource: "invoice"
    };
  }

  // Recomputes a draft invoice from the current usage and catalog.
  rpc RefreshInvoice(RefreshInvoiceRequest) returns (RefreshInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:refresh"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Refreshes and finalizes a draft invoice.
  rpc FinalizeInvoice(FinalizeInvoiceRequest) returns (FinalizeInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:finalize"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Refreshes and finalizes every draft invoice, in the background.
  rpc FinalizeAllInvoices(FinalizeAllInvoicesRequest) returns (FinalizeAllInvoicesResponse) {
    option (google.api.http) = {
      post: "/v1/invoices:finalize_all"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Voids a finalized invoice, re-crediting coupons, prepaid credits and
  // credit notes, and optionally issuing a credit note.
  rpc VoidInvoice(VoidInvoiceRequest) returns (VoidInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:void"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:void"
      api_resource: "invoice"
    };
  }

  // Issues a new invoice from a voided one with adjusted fees; with
  // validate_only, previews it.
  rpc RegenerateInvoice(RegenerateInvoiceRequest) returns (RegenerateInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:regenerate"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:create"
      api_resource: "invoice"
    };
  }

  // Retries a failed invoice: its generation or its provider tax
  // computation.
  rpc RetryInvoice(RetryInvoiceRequest) returns (RetryInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:retry"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Retries the payment of a finalized, unpaid invoice.
  rpc RetryInvoicePayment(RetryInvoicePaymentRequest) returns (RetryInvoicePaymentResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:retry_payment"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Retries every failed invoice, in the background.
  rpc RetryAllInvoices(RetryAllInvoicesRequest) returns (RetryAllInvoicesResponse) {
    option (google.api.http) = {
      post: "/v1/invoices:retry_all"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Retries the payment of every finalized invoice whose payment is
  // pending or failed and that no payment provider is processing, in the
  // background.
  rpc RetryAllInvoicePayments(RetryAllInvoicePaymentsRequest) returns (RetryAllInvoicePaymentsResponse) {
    option (google.api.http) = {
      post: "/v1/invoices:retry_all_payments"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Queues the synchronization of an invoice with the customer's
  // accounting integration again, finding the provider's record first.
  rpc RetryInvoiceSync(RetryInvoiceSyncRequest) returns (RetryInvoiceSyncResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:retry_sync"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Tells the tax provider again that a voided invoice was voided.
  rpc RetryInvoiceTaxVoiding(RetryInvoiceTaxVoidingRequest) returns (RetryInvoiceTaxVoidingResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:retry_tax_voiding"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Marks the payment dispute of an invoice as lost.
  rpc LoseInvoiceDispute(LoseInvoiceDisputeRequest) returns (LoseInvoiceDisputeResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:lose_dispute"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }

  // Returns signed URLs of the invoice's PDF and XML, generating them when
  // missing.
  rpc DownloadInvoice(DownloadInvoiceRequest) returns (DownloadInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:download"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:read"
      api_resource: "invoice"
    };
  }

  // Sends the invoice email again.
  rpc ResendInvoice(ResendInvoiceRequest) returns (ResendInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:resend"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:send"
      api_resource: "invoice"
    };
  }

  // Returns a payment provider checkout URL for an unpaid invoice.
  rpc GenerateInvoicePaymentUrl(GenerateInvoicePaymentUrlRequest) returns (GenerateInvoicePaymentUrlResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:generate_payment_url"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:read"
      api_resource: "invoice"
    };
  }

  // Previews the next invoice of a customer: a proposal for a new
  // subscription, the projection of existing ones, a termination or a
  // plan change. Nothing is stored.
  rpc PreviewInvoice(PreviewInvoiceRequest) returns (PreviewInvoiceResponse) {
    option (google.api.http) = {
      post: "/v1/invoices:preview"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:read"
      api_resource: "invoice"
    };
  }

  // Stores the Salesforce ID of an invoice.
  rpc SetInvoiceSalesforceId(SetInvoiceSalesforceIdRequest) returns (SetInvoiceSalesforceIdResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}:set_salesforce_id"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "invoice"
    };
  }
}

// FeeService reads and adjusts fees.
service FeeService {
  // Returns a fee.
  rpc GetFee(GetFeeRequest) returns (GetFeeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/fees/{fee_id}"};
    option (tanvo.common.v1.access) = {
      permission: "invoices:read"
      api_resource: "fee"
    };
  }

  // Lists fees, oldest first.
  rpc ListFees(ListFeesRequest) returns (ListFeesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/fees"};
    option (tanvo.common.v1.access) = {
      permission: "invoices:read"
      api_resource: "fee"
    };
  }

  // Updates the payment status of an in-advance fee not attached to an
  // invoice.
  rpc UpdateFee(UpdateFeeRequest) returns (UpdateFeeResponse) {
    option (google.api.http) = {
      patch: "/v1/fees/{fee.id}"
      body: "fee"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "fee"
    };
  }

  // Discards an in-advance fee not attached to an invoice and returns it.
  rpc DeleteFee(DeleteFeeRequest) returns (DeleteFeeResponse) {
    option (google.api.http) = {delete: "/v1/fees/{fee_id}"};
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "fee"
    };
  }

  // Adjusts a fee of a draft invoice: its display name, units or unit
  // price. Setting fee_id or a charge creates the fee when it is missing.
  rpc AdjustFee(AdjustFeeRequest) returns (AdjustFeeResponse) {
    option (google.api.http) = {
      post: "/v1/invoices/{invoice_id}/fees:adjust"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "fee"
    };
  }

  // Removes the adjustment of a draft invoice fee.
  rpc DeleteFeeAdjustment(DeleteFeeAdjustmentRequest) returns (DeleteFeeAdjustmentResponse) {
    option (google.api.http) = {
      post: "/v1/fees/{fee_id}:delete_adjustment"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoices:update"
      api_resource: "fee"
    };
  }
}

// InvoiceCustomSectionService manages invoice custom sections: text printed
// on invoices, resolved from subscription, customer and billing entity.
service InvoiceCustomSectionService {
  // Creates an invoice custom section.
  rpc CreateInvoiceCustomSection(CreateInvoiceCustomSectionRequest) returns (CreateInvoiceCustomSectionResponse) {
    option (google.api.http) = {
      post: "/v1/invoice_custom_sections"
      body: "invoice_custom_section"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoice_custom_sections:create"
      api_resource: "invoice_custom_section"
    };
  }

  // Returns an invoice custom section.
  rpc GetInvoiceCustomSection(GetInvoiceCustomSectionRequest) returns (GetInvoiceCustomSectionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/invoice_custom_sections/{invoice_custom_section_id}"};
    option (tanvo.common.v1.access) = {
      permission: "invoice_custom_sections:read"
      api_resource: "invoice_custom_section"
    };
  }

  // Lists invoice custom sections.
  rpc ListInvoiceCustomSections(ListInvoiceCustomSectionsRequest) returns (ListInvoiceCustomSectionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/invoice_custom_sections"};
    option (tanvo.common.v1.access) = {
      permission: "invoice_custom_sections:read"
      api_resource: "invoice_custom_section"
    };
  }

  // Updates an invoice custom section.
  rpc UpdateInvoiceCustomSection(UpdateInvoiceCustomSectionRequest) returns (UpdateInvoiceCustomSectionResponse) {
    option (google.api.http) = {
      patch: "/v1/invoice_custom_sections/{invoice_custom_section.id}"
      body: "invoice_custom_section"
    };
    option (tanvo.common.v1.access) = {
      permission: "invoice_custom_sections:update"
      api_resource: "invoice_custom_section"
    };
  }

  // Deletes an invoice custom section and detaches it everywhere.
  rpc DeleteInvoiceCustomSection(DeleteInvoiceCustomSectionRequest) returns (DeleteInvoiceCustomSectionResponse) {
    option (google.api.http) = {delete: "/v1/invoice_custom_sections/{invoice_custom_section_id}"};
    option (tanvo.common.v1.access) = {
      permission: "invoice_custom_sections:delete"
      api_resource: "invoice_custom_section"
    };
  }
}

// InvoiceType is what an invoice bills.
enum InvoiceType {
  // Not set.
  INVOICE_TYPE_UNSPECIFIED = 0;
  // Subscription fees and usage of a billing period.
  INVOICE_TYPE_SUBSCRIPTION = 1;
  // A paid wallet top-up.
  INVOICE_TYPE_CREDIT = 2;
  // One-off add-on fees.
  INVOICE_TYPE_ONE_OFF = 3;
  // In-advance charge fees grouped at the period end.
  INVOICE_TYPE_ADVANCE_CHARGES = 4;
  // Usage billed when a usage threshold is crossed.
  INVOICE_TYPE_PROGRESSIVE_BILLING = 5;
}

// InvoiceStatus is the state of an invoice.
enum InvoiceStatus {
  // Not set.
  INVOICE_STATUS_UNSPECIFIED = 0;
  // Fees are being computed.
  INVOICE_STATUS_GENERATING = 1;
  // Editable during the grace period.
  INVOICE_STATUS_DRAFT = 2;
  // A credit invoice waiting for its payment.
  INVOICE_STATUS_OPEN = 3;
  // Final.
  INVOICE_STATUS_FINALIZED = 4;
  // A credit invoice whose payment failed.
  INVOICE_STATUS_CLOSED = 5;
  // Canceled after finalization.
  INVOICE_STATUS_VOIDED = 6;
  // Generation or tax computation failed.
  INVOICE_STATUS_FAILED = 7;
  // Held until taxes or a VIES check complete.
  INVOICE_STATUS_PENDING = 8;
  // A deleted draft: kept with its fees, invisible, terminal.
  INVOICE_STATUS_DELETED = 9;
}

// TaxStatus is the state of provider tax computation.
enum TaxStatus {
  // Not set.
  TAX_STATUS_UNSPECIFIED = 0;
  // Being computed.
  TAX_STATUS_PENDING = 1;
  // Computed.
  TAX_STATUS_SUCCEEDED = 2;
  // Failed.
  TAX_STATUS_FAILED = 3;
}

// InvoicingReason is why a subscription is on an invoice.
enum InvoicingReason {
  // Not set.
  INVOICING_REASON_UNSPECIFIED = 0;
  // The subscription started.
  INVOICING_REASON_SUBSCRIPTION_STARTING = 1;
  // A billing period ended.
  INVOICING_REASON_SUBSCRIPTION_PERIODIC = 2;
  // The subscription was terminated.
  INVOICING_REASON_SUBSCRIPTION_TERMINATING = 3;
  // An in-advance charge was triggered.
  INVOICING_REASON_IN_ADVANCE_CHARGE = 4;
  // In-advance charges were grouped at the period end.
  INVOICING_REASON_IN_ADVANCE_CHARGE_PERIODIC = 5;
  // A usage threshold was crossed.
  INVOICING_REASON_PROGRESSIVE_BILLING = 6;
}

// FeePaymentStatus is the payment state of an in-advance fee.
enum FeePaymentStatus {
  // Not set.
  FEE_PAYMENT_STATUS_UNSPECIFIED = 0;
  // Not paid yet.
  FEE_PAYMENT_STATUS_PENDING = 1;
  // Paid.
  FEE_PAYMENT_STATUS_SUCCEEDED = 2;
  // The payment failed.
  FEE_PAYMENT_STATUS_FAILED = 3;
  // Refunded.
  FEE_PAYMENT_STATUS_REFUNDED = 4;
}

// SettlementType is what settled part of an invoice.
enum SettlementType {
  // Not set.
  SETTLEMENT_TYPE_UNSPECIFIED = 0;
  // A payment.
  SETTLEMENT_TYPE_PAYMENT = 1;
  // A credit note offset.
  SETTLEMENT_TYPE_CREDIT_NOTE = 2;
}

// InvoiceCustomSectionType is the origin of an invoice custom section.
enum InvoiceCustomSectionType {
  // Not set.
  INVOICE_CUSTOM_SECTION_TYPE_UNSPECIFIED = 0;
  // Written by the organization.
  INVOICE_CUSTOM_SECTION_TYPE_MANUAL = 1;
  // Generated by Tanvo (for example by an integration).
  INVOICE_CUSTOM_SECTION_TYPE_SYSTEM_GENERATED = 2;
}

// FeeAdjustmentMode is what an adjustment changes.
enum FeeAdjustmentMode {
  // Not set.
  FEE_ADJUSTMENT_MODE_UNSPECIFIED = 0;
  // The display name only.
  FEE_ADJUSTMENT_MODE_DISPLAY_NAME = 1;
  // The units, priced by the charge model.
  FEE_ADJUSTMENT_MODE_UNITS = 2;
  // The units and the unit price.
  FEE_ADJUSTMENT_MODE_UNITS_AND_UNIT_PRICE = 3;
}

// InvoiceErrorCode is the kind of error of a failed invoice.
enum InvoiceErrorCode {
  // Not set.
  INVOICE_ERROR_CODE_UNSPECIFIED = 0;
  // Unknown.
  INVOICE_ERROR_CODE_NOT_PROVIDED = 1;
  // Provider tax computation failed.
  INVOICE_ERROR_CODE_TAX_ERROR = 2;
  // Provider tax voiding failed.
  INVOICE_ERROR_CODE_TAX_VOIDING_ERROR = 3;
  // Generation failed.
  INVOICE_ERROR_CODE_INVOICE_GENERATION_ERROR = 4;
}

// AppliedTax is a tax applied to fees or an invoice.
message AppliedTax {
  // The tax.
  string tax_id = 1;
  // The tax code.
  string tax_code = 2;
  // The tax name.
  string tax_name = 3;
  // The tax description.
  string tax_description = 4;
  // The rate in percent.
  string tax_rate = 5;
  // The taxable base.
  tanvo.common.v1.Money taxable_amount = 6;
  // The tax amount.
  tanvo.common.v1.Money amount = 7;
  // The unrounded tax amount.
  string precise_amount = 8;
}

// PricingUnitUsage is a fee's amount in a charge's pricing unit.
message PricingUnitUsage {
  // The pricing unit.
  string pricing_unit_id = 1;
  // The pricing unit's short name.
  string short_name = 2;
  // The pricing unit's value in the fee currency.
  string conversion_rate = 3;
  // The amount in pricing units.
  string amount = 4;
  // The unit price in pricing units.
  string unit_amount = 5;
}

// Fee is a line of an invoice, or an in-advance fee.
message Fee {
  option (google.api.resource) = {
    type: "tanvo.xyz/Fee"
    pattern: "fees/{fee}"
    plural: "fees"
    singular: "fee"
  };

  // The fee's ID.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The invoice; unset for in-advance fees not invoiced.
  string invoice_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The subscription.
  string subscription_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The customer.
  string customer_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What the fee bills.
  tanvo.common.v1.FeeType fee_type = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The charge.
  string charge_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The charge filter.
  string charge_filter_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The fixed charge.
  string fixed_charge_id = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The add-on.
  string add_on_id = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The billable metric code, for charge fees.
  string billable_metric_code = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The commitment.
  string commitment_id = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The wallet transaction, for credit fees.
  string wallet_transaction_id = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The grouping values.
  map<string, string> grouped_by = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The invoice line name.
  string invoice_display_name = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A description.
  string description = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The amount before taxes.
  tanvo.common.v1.Money amount = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The unrounded amount.
  string precise_amount = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The unit price.
  string unit_amount = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The units billed.
  string units = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The units aggregated before the charge model.
  string total_aggregated_units = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The number of events.
  int64 events_count = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The taxes.
  tanvo.common.v1.Money taxes_amount = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The tax rate in percent.
  string taxes_rate = 23 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The amount with taxes.
  tanvo.common.v1.Money total_amount = 24 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The coupons allocated to the fee, unrounded.
  string precise_coupons_amount = 25 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The credit notes issued on the fee, unrounded.
  string precise_credit_notes_amount = 26 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Marks an in-advance fee.
  bool pay_in_advance = 27 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Marks a fee that goes on an invoice.
  bool invoiceable = 28 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The payment state of an in-advance fee; the only editable field.
  FeePaymentStatus payment_status = 29 [(buf.validate.field).enum.defined_only = true];
  // The period the fee covers.
  tanvo.common.v1.DateTimeRange period = 30 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The usage period of a charge fee.
  tanvo.common.v1.DateTimeRange charges_period = 31 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The fee a commitment true-up completes.
  string true_up_parent_fee_id = 32 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The commitment true-up fee completing this fee.
  string true_up_fee_id = 33 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The amount in the charge's pricing unit.
  PricingUnitUsage pricing_unit_usage = 34 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The taxes applied.
  repeated AppliedTax applied_taxes = 35 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The transaction ID of the event that created an in-advance fee.
  string event_transaction_id = 36 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Marks a fee adjusted on a draft invoice.
