    message: "name, event_types and a target are required"
    expression: "has(this.streaming_destination.name) && size(this.streaming_destination.event_types) > 0 && (has(this.streaming_destination.kafka) || has(this.streaming_destination.kinesis) || has(this.streaming_destination.s3))"
  };

  // The destination to create.
  StreamingDestination streaming_destination = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
