edition = "2023";

// Package tanvo.webhook.v1 is the API of webhook endpoints and their
// deliveries.
package tanvo.webhook.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "tanvo/common/v1/options.proto";

// WebhookService manages webhook endpoints and their deliveries. Payloads
// are signed with Standard Webhooks.
service WebhookService {
  // Creates a webhook endpoint; at most 10 per organization.
  rpc CreateWebhookEndpoint(CreateWebhookEndpointRequest) returns (CreateWebhookEndpointResponse) {
    option (google.api.http) = {
      post: "/v1/webhook_endpoints"
      body: "webhook_endpoint"
    };
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Returns a webhook endpoint.
  rpc GetWebhookEndpoint(GetWebhookEndpointRequest) returns (GetWebhookEndpointResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/webhook_endpoints/{webhook_endpoint_id}"};
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Lists webhook endpoints.
  rpc ListWebhookEndpoints(ListWebhookEndpointsRequest) returns (ListWebhookEndpointsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/webhook_endpoints"};
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Updates a webhook endpoint's URL, name or event types.
  rpc UpdateWebhookEndpoint(UpdateWebhookEndpointRequest) returns (UpdateWebhookEndpointResponse) {
    option (google.api.http) = {
      patch: "/v1/webhook_endpoints/{webhook_endpoint.id}"
      body: "webhook_endpoint"
    };
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Deletes a webhook endpoint.
  rpc DeleteWebhookEndpoint(DeleteWebhookEndpointRequest) returns (DeleteWebhookEndpointResponse) {
    option (google.api.http) = {delete: "/v1/webhook_endpoints/{webhook_endpoint_id}"};
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Lists the event types endpoints can subscribe to.
  rpc ListWebhookEventTypes(ListWebhookEventTypesRequest) returns (ListWebhookEventTypesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/webhook_event_types"};
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Returns a delivery.
  rpc GetWebhookDelivery(GetWebhookDeliveryRequest) returns (GetWebhookDeliveryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/webhook_endpoints/{webhook_endpoint_id}/deliveries/{delivery_id}"};
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Lists the deliveries of an endpoint, the last updated first; kept 90
  // days.
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/webhook_endpoints/{webhook_endpoint_id}/deliveries"};
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }

  // Sends a failed delivery again.
  rpc RetryWebhookDelivery(RetryWebhookDeliveryRequest) returns (RetryWebhookDeliveryResponse) {
    option (google.api.http) = {
      post: "/v1/webhook_endpoints/{webhook_endpoint_id}/deliveries/{delivery_id}:retry"
      body: "*"
    };
    option (tanvo.common.v1.access) = {
      permission: "developers:manage"
      api_resource: "webhook_endpoint"
    };
  }
}

// DeliveryStatus is the state of a webhook delivery.
enum DeliveryStatus {
  // Not set.
  DELIVERY_STATUS_UNSPECIFIED = 0;
  // Not sent yet.
  DELIVERY_STATUS_PENDING = 1;
  // Failed and scheduled again.
  DELIVERY_STATUS_RETRYING = 2;
  // Accepted by the endpoint.
  DELIVERY_STATUS_SUCCEEDED = 3;
  // Failed after the last attempt.
  DELIVERY_STATUS_FAILED = 4;
}

// WebhookEndpoint receives signed event payloads over HTTP.
message WebhookEndpoint {
  option (google.api.resource) = {
    type: "tanvo.xyz/WebhookEndpoint"
    pattern: "webhook_endpoints/{webhook_endpoint}"
    plural: "webhookEndpoints"
    singular: "webhookEndpoint"
  };

  // The endpoint's ID.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The HTTPS URL; unique within the organization.
  string url = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      uri: true
      max_len: 2048
    }
  ];
  // A display name.
  string name = 3 [(buf.validate.field).string.max_len = 255];
  // The event types delivered; all by default.
  repeated string event_types = 4 [(buf.validate.field).repeated = {
    unique: true
    max_items: 200
    items: {
      string: {pattern: "^[a-z][a-z_]*(\\.[a-z][a-z_0-9]*)+$"}
    }
  }];
  // The signing secret (`whsec_…`); returned on create only.
  string secret = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the endpoint was created.
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the endpoint last changed.
  google.protobuf.Timestamp updated_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// WebhookEventType describes an event type.
message WebhookEventType {
  // The name, `<object>.<action>`.
  string name = 1;
  // The category it belongs to.
  string category = 2;
  // A description.
  string description = 3;
}

// WebhookDelivery is the delivery of one event to one endpoint.
message WebhookDelivery {
  // The delivery's ID, sent as the webhook-id header.
  string id = 1;
  // The endpoint.
  string webhook_endpoint_id = 2;
  // The event type.
  string event_type = 3;
  // The type of the object the event is about.
  string object_type = 4;
  // The ID of the object.
  string object_id = 5;
  // The JSON payload.
  bytes payload = 6;
  // The state.
  DeliveryStatus status = 7;
  // The number of attempts.
  int32 attempts = 8;
  // The HTTP status of the last attempt.
  int32 http_status = 9;
  // The start of the response body of the last attempt.
  string response = 10;
  // When the last attempt was made.
  google.protobuf.Timestamp last_attempt_at = 11;
  // When the next attempt is due.
  google.protobuf.Timestamp next_attempt_at = 12;
  // When the delivery was created.
  google.protobuf.Timestamp created_at = 13;
}

// CreateWebhookEndpointRequest is the request of WebhookService.CreateWebhookEndpoint.
message CreateWebhookEndpointRequest {
  option (buf.validate.message).cel = {
    id: "webhook_endpoint.url"
    message: "url is required"
    expression: "has(this.webhook_endpoint.url)"
  };

  // The endpoint to create.
  WebhookEndpoint webhook_endpoint = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// CreateWebhookEndpointResponse is the response of WebhookService.CreateWebhookEndpoint.
message CreateWebhookEndpointResponse {
  // The created endpoint, with its secret.
  WebhookEndpoint webhook_endpoint = 1;
}

// GetWebhookEndpointRequest is the request of WebhookService.GetWebhookEndpoint.
message GetWebhookEndpointRequest {
  // The endpoint's ID.
  string webhook_endpoint_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// GetWebhookEndpointResponse is the response of WebhookService.GetWebhookEndpoint.
message GetWebhookEndpointResponse {
  // The endpoint.
  WebhookEndpoint webhook_endpoint = 1;
}

// ListWebhookEndpointsRequest is the request of WebhookService.ListWebhookEndpoints.
message ListWebhookEndpointsRequest {
  // The maximum number of results; 20 by default, at most 1000.
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The next_page_token of the previous page.
  string page_token = 2 [(buf.validate.field).string.max_len = 1024];
}

// ListWebhookEndpointsResponse is the response of WebhookService.ListWebhookEndpoints.
message ListWebhookEndpointsResponse {
  // The endpoints of this page.
  repeated WebhookEndpoint webhook_endpoints = 1;
  // The token of the next page; empty on the last page.
  string next_page_token = 2;
}

// UpdateWebhookEndpointRequest is the request of WebhookService.UpdateWebhookEndpoint.
message UpdateWebhookEndpointRequest {
  option (buf.validate.message).cel = {
    id: "webhook_endpoint.id"
    message: "webhook_endpoint.id is required"
    expression: "has(this.webhook_endpoint.id)"
  };

  // The new values; webhook_endpoint.id selects the endpoint.
  WebhookEndpoint webhook_endpoint = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  // The fields to update; empty updates every field that is set.
  google.protobuf.FieldMask update_mask = 2;
}

// UpdateWebhookEndpointResponse is the response of WebhookService.UpdateWebhookEndpoint.
message UpdateWebhookEndpointResponse {
  // The updated endpoint.
  WebhookEndpoint webhook_endpoint = 1;
}

// DeleteWebhookEndpointRequest is the request of WebhookService.DeleteWebhookEndpoint.
message DeleteWebhookEndpointRequest {
  // The endpoint's ID.
  string webhook_endpoint_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// DeleteWebhookEndpointResponse is the response of WebhookService.DeleteWebhookEndpoint.
message DeleteWebhookEndpointResponse {}

// ListWebhookEventTypesRequest is the request of WebhookService.ListWebhookEventTypes.
message ListWebhookEventTypesRequest {}

// ListWebhookEventTypesResponse is the response of WebhookService.ListWebhookEventTypes.
message ListWebhookEventTypesResponse {
  // The event types.
  repeated WebhookEventType event_types = 1;
}

// GetWebhookDeliveryRequest is the request of WebhookService.GetWebhookDelivery.
message GetWebhookDeliveryRequest {
  // The endpoint's ID.
  string webhook_endpoint_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The delivery's ID.
  string delivery_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// GetWebhookDeliveryResponse is the response of WebhookService.GetWebhookDelivery.
message GetWebhookDeliveryResponse {
  // The delivery.
  WebhookDelivery delivery = 1;
}

// ListWebhookDeliveriesRequest is the request of WebhookService.ListWebhookDeliveries.
message ListWebhookDeliveriesRequest {
  // The endpoint's ID.
  string webhook_endpoint_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The maximum number of results; 20 by default, at most 1000.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The next_page_token of the previous page.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
  // An AIP-160 filter: equalities on `status`, `event_type` and
  // `http_status` (each with several values joined by OR), and bounds on
  // `updated_at` (`updated_at >= "2025-01-01T00:00:00Z"`, with >= and
  // <=). An `http_status` value is a code (`404`), a class (`"5xx"`), a
  // range (`"200-204"`) or `timeout`: no response on a failed delivery.
  string filter = 4 [(buf.validate.field).string.max_len = 2048];
  // A search over the delivery ID and the object ID.
  string search = 5 [(buf.validate.field).string.max_len = 255];
}

// ListWebhookDeliveriesResponse is the response of WebhookService.ListWebhookDeliveries.
message ListWebhookDeliveriesResponse {
  // The deliveries of this page.
  repeated WebhookDelivery deliveries = 1;
  // The token of the next page; empty on the last page.
  string next_page_token = 2;
}

// RetryWebhookDeliveryRequest is the request of WebhookService.RetryWebhookDelivery.
message RetryWebhookDeliveryRequest {
  // The endpoint's ID.
  string webhook_endpoint_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The delivery's ID.
  string delivery_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// RetryWebhookDeliveryResponse is the response of WebhookService.RetryWebhookDelivery.
message RetryWebhookDeliveryResponse {
  // The delivery, scheduled again.
  WebhookDelivery delivery = 1;
}
