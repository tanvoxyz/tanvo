// ListProductFiltersRequest is the request of ProductService.ListProductFilters.
message ListProductFiltersRequest {
  // The product's ID or `code:<code>`.
  string product_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string.(tanvo.common.v1.ref) = true
  ];
  // The maximum number of results; 20 by default, at most 1000.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The next_page_token of the previous page.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
  // Keeps the filters whose name or code contains the term.
  string search = 4 [(buf.validate.field).string.max_len = 255];
}

// ListProductFiltersResponse is the response of ProductService.ListProductFilters.
message ListProductFiltersResponse {
