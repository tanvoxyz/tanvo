# Simplified Chinese (mainland terminology). A Tanvo addition: lago-api ships
# zh-TW only (config/application.rb:49). Keys and formats mirror zh-TW.yaml;
# missing keys fall back to en.yml.
date:
    abbr_month_names:
        - null
        - 一月
        - 二月
        - 三月
        - 四月
        - 五月
        - 六月
