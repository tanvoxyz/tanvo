# Ported from lago-api config/locales/de.yml and config/locales/de/*.yml
# (email strings and the formats they use), with "Lago" renamed "Tanvo".
# Missing keys fall back to en.yml.
date:
    abbr_month_names:
        - null
        - Jan.
        - Feb.
        - Mär.
        - Apr.
        - Mai
        - Jun.
        - Jul.
        - Aug.
        - Sep.
        - Okt.
        - Nov.
        - Dez.
    formats:
        default: '%d. %b %Y'
    month_names:
        - null
        - Januar
        - Februar
        - März
        - April
        - Mai
        - Juni
        - Juli
        - August
        - September
        - Oktober
        - November
        - Dezember
email:
    credit_note:
        created:
            credit_note_from: Gutschriftsbeleg von %{billing_entity_name}
            credit_note_number: Gutschriftsbelegnummer
            credited_notice: Gutschrift auf Kundenkonto am %{date}
            download: Gutschriftsbeleg herunterladen, um Details anzuzeigen
            invoice_number: Rechnungsnummer
            issue_date: Ausstellungsdatum
            issued_notice: Ausgestellt am %{date}
            offset_invoice_notice: Rechnung %{invoice_number} am %{date} ausgeglichen
            refunded_notice: Zurückerstattet am %{date}
            subject: 'Dein Gutschriftsbeleg von %{billing_entity_name} #%{credit_note_number}'
    invoice:
        finalized:
            download: Rechnung herunterladen, um Details anzuzeigen
            due_date: Gesamtbetrag fällig am %{date}
            invoice_from: Rechnung von %{billing_entity_name}
            invoice_number: Rechnungsnummer
            issue_date: Ausstellungsdatum
            issued_on: ausgestellt am %{date}
            subject: 'Deine Rechnung von %{billing_entity_name} #%{invoice_number}'
    payment_receipt:
        created:
            payment_receipt_from: Zahlungsquittung von %{billing_entity_name}
            subject: 'Ihre Zahlungsquittung von %{billing_entity_name} #%{payment_receipt_number}'
    payment_request:
        requested:
            already_paid: Wenn Sie die Zahlung bereits vorgenommen haben, ignorieren Sie bitte diese E-Mail.
            hello: Hallo %{customer_name},
            pay_amount: Restbetrag bezahlen
            payment_terms:
                one: Unsere vertraglich vereinbarten Zahlungsbedingungen sind %{count} Tag.
                other: Unsere vertraglich vereinbarten Zahlungsbedingungen sind %{count} Tage.
                zero: Unsere vertraglich vereinbarten Zahlungsbedingungen erfordern die Zahlung bei Rechnungserstellung.
            remaining_amount: Restbetrag zu zahlen
            reminder_overdue_balance: Dies ist eine Erinnerung des Finanzteams von %{billing_entity_name}, dass einige Rechnungen überfällig sind.
            subject: Ihr überfälliger Saldo von %{billing_entity_name}
            thank_you: Danke.
            total_amount_due: Der insgesamt fällige Betrag beträgt %{amount}.
    questions: Fragen? Kontaktiere uns unter
invoice:
    total: Gesamt
    total_due_amount: Betrag fällig
    total_paid_amount: Betrag bezahlt
money:
    custom_format: '%{iso_code} %n'
    decimal_mark: ','
    format: '%u%n'
    thousands_separator: .
payment_receipt:
    download_receipt: Quittung herunterladen
    number: Quittungsnummer
    paid_on: 'Bezahlt am %{date} (Restbetrag: %{total_due_amount})'
    payment_date: Bezahlt am
