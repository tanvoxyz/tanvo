# Redpanda Connect: consumes an SQS queue and produces its events to the
# raw events topic of Tanvo's Kafka ingestion. See README.md.
input:
  label: sqs_tanvo_ingestor
  aws_sqs:
    url: "${SQS_ENDPOINT}"
    max_number_of_messages: 10
    region: "${SQS_REGION}"
    credentials:
      id: "${SQS_KEY_ID}"
      secret: "${SQS_KEY_SECRET}"

pipeline:
  processors:
    - resource: tanvo_event_mapping

output:
  switch:
    cases:
      # Without SQS_DLQ_ENDPOINT, the events that fail to map go to Kafka,
      # where the intake consumer dead-letters them.
      - check: errored() && env("SQS_DLQ_ENDPOINT").or("") != ""
        output:
          resource: tanvo_sqs_ingestor_dlq
      - output:
          resource: tanvo_kafka_events_raw

processor_resources:
  - label: tanvo_event_mapping
    mapping: |
      root.organization_id = "${ORGANIZATION_ID}"
      root.external_subscription_id = this.event.external_subscription_id
      root.transaction_id = this.event.transaction_id
      root.code = this.event.code
      root.timestamp = this.event.timestamp
      root.properties = this.event.properties
      root.ingested_at = timestamp_unix()
      root.source = "sqs_connector"
      root.precise_total_amount_cents = if this.event.precise_total_amount_cents.type() == "number" {
        this.event.precise_total_amount_cents
      } else {
        "0"
      }

output_resources:
  - label: tanvo_kafka_events_raw
    kafka_franz:
      seed_brokers: ["${KAFKA_BROKERS}"]
      topic: "${KAFKA_TOPIC:events.raw}"
      key: '${! json("organization_id") }/${! json("external_subscription_id") }/${! json("transaction_id") }'
      tls:
        enabled: true
      sasl:
        - mechanism: SCRAM-SHA-512
          username: "${KAFKA_USER}"
          password: "${KAFKA_PASSWORD}"
  - label: tanvo_sqs_ingestor_dlq
    aws_sqs:
      url: "${SQS_DLQ_ENDPOINT:}"
      region: "${SQS_REGION}"
      credentials:
        id: "${SQS_KEY_ID}"
        secret: "${SQS_KEY_SECRET}"

metrics:
  prometheus: {}

tests:
  - name: "Mapping Test with all fields"
    target_processors: "/pipeline/processors"
    environment:
      ORGANIZATION_ID: "0199a000-0000-7000-8000-0000000000aa"
    input_batch:
      - json_content:
          event:
            external_subscription_id: "123"
            transaction_id: "456"
            code: "789"
            timestamp: 1609459200
            properties:
              key1: "value1"
              key2: "value2"
            precise_total_amount_cents: 100
    output_batches:
      - - json_contains:
            organization_id: "0199a000-0000-7000-8000-0000000000aa"
            external_subscription_id: "123"
            transaction_id: "456"
            code: "789"
            timestamp: 1609459200
            properties:
              key1: "value1"
              key2: "value2"
            source: "sqs_connector"
            precise_total_amount_cents: 100
  - name: "Mapping test without precise_total_amount_cents"
    target_processors: "/pipeline/processors"
    environment:
      ORGANIZATION_ID: "0199a000-0000-7000-8000-0000000000aa"
    input_batch:
      - json_content:
          event:
            external_subscription_id: "123"
            transaction_id: "456"
            code: "789"
            timestamp: 1609459200
            properties:
              key1: "value1"
              key2: "value2"
    output_batches:
      - - json_contains:
            organization_id: "0199a000-0000-7000-8000-0000000000aa"
            external_subscription_id: "123"
            transaction_id: "456"
            code: "789"
            timestamp: 1609459200
            properties:
              key1: "value1"
              key2: "value2"
            precise_total_amount_cents: "0"
  - name: "Message that is not JSON fails to map"
    target_processors: "/pipeline/processors"
    environment:
      ORGANIZATION_ID: "0199a000-0000-7000-8000-0000000000aa"
    input_batch:
      - content: "not json"
    output_batches:
      - - bloblang: "errored()"
