# Ported from lago spec/models/applied_coupon_spec.rb, spec/services/applied_coupons/amount_service_spec.rb, spec/services/credits/applied_coupon_service_spec.rb and spec/services/applied_coupons/recredit_service_spec.rb (the rules of domain §22.7 and
# §11.4). Each case builds an applied coupon (fixed_amount 12 USD minor
# units, once, active unless status says otherwise) and runs op:
#   validate        -> errors
#   discount        -> Discount(base) = want_discount
#   consume         -> Consume(credit), then the wants
#   restore         -> Restore(credit, coupon_terminated), then the wants
#   consume_restore -> Consume(credit) then Restore(credit, coupon_terminated)
# Lago derives the remaining amount of a once coupon from its credits
# (ignoring credits of voided invoices); Tanvo stores remaining_amount,
# decremented by Consume and restored by Restore.
defaults:
  coupon_type: fixed_amount
  amount: 12
  frequency: once
cases:
  - {name: valid, source: "tanvo", op: validate, errors: []}
  - {name: amount of 0, source: "spec/models/applied_coupon_spec.rb:27", op: validate, amount: 0, errors: []}
  - {name: negative amount, source: "spec/models/applied_coupon_spec.rb:27", op: validate, amount: -1, errors: ["amount_cents: value_is_negative", "remaining_amount: value_is_negative"]}
  - {name: recurring requires duration, source: "spec/models/applied_coupon_spec.rb:36", op: validate, frequency: recurring, errors: ["frequency_duration: value_is_mandatory", "frequency_duration_remaining: value_is_mandatory"]}
  - {name: recurring duration must be positive, source: "spec/models/applied_coupon_spec.rb:37", op: validate, frequency: recurring, frequency_duration: 0, duration_remaining: 0, errors: ["frequency_duration: value_is_out_of_range"]}
  - {name: recurring remaining of 0, source: "spec/models/applied_coupon_spec.rb:39", op: validate, frequency: recurring, frequency_duration: 3, duration_remaining: 0, errors: []}
  - {name: recurring remaining must not be negative, source: "spec/models/applied_coupon_spec.rb:39", op: validate, frequency: recurring, frequency_duration: 3, duration_remaining: -1, errors: ["frequency_duration_remaining: value_is_out_of_range"]}
  - {name: once without duration, source: "spec/models/applied_coupon_spec.rb:45", op: validate, errors: []}
  - {name: forever without duration, source: "spec/models/applied_coupon_spec.rb:52", op: validate, frequency: forever, errors: []}
  - {name: percentage above 100, source: "tanvo", op: validate, coupon_type: percentage, percentage_rate: "120", errors: ["percentage_rate: value_is_out_of_range"]}

