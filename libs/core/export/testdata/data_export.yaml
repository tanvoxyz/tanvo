# Ported from lago spec/models/data_export_spec.rb. Each case builds an
# invoices CSV export in a status, with or without a file, and lists the
# field errors of Validate and, at "now", whether it is expired (expires_at
# relative to now in hours; null for none).
defaults: {status: pending, file: false, expires_in_hours: null, errors: [], expired: false}
cases:
