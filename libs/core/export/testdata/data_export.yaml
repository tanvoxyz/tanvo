  - {name: completed with file, source: "spec/models/data_export_spec.rb:33", status: completed, file: true}
  - {name: pending without file, source: "spec/models/data_export_spec.rb:39", status: pending}
  - {name: processing without file, source: "spec/models/data_export_spec.rb:39", status: processing}
  - {name: failed without file, source: "spec/models/data_export_spec.rb:39", status: failed}
  - {name: not expired without expires_at, source: "spec/models/data_export_spec.rb:81"}
  - {name: completed not yet expired, source: "spec/models/data_export_spec.rb:83", status: completed, file: true, expires_in_hours: 168}
  - {name: expiration date reached, source: "spec/models/data_export_spec.rb:89", status: completed, file: true, expires_in_hours: -1, expired: true}
