# VAT number syntax (NormalizeVATNumber, VATNumberCountry,
# ValidVATNumberSyntax), VIES fault classification (VIESFault) and the VIES
# retry delays (VIESRetryDelay). The syntaxes follow the valvat gem lago
# uses; its own tests live outside lago-api, so the syntax cases are Tanvo's.
cases:
  - name: a malformed VAT number has no valid format
    source: spec/services/customers/vies_check_service_spec.rb:108
    op: vat_number
    input: {number: invalid_vat_number}
    want: {normalized: INVALIDVATNUMBER, valid: false}

  - name: an invalid VAT number in a French territory is not well formed
    source: spec/services/customers/eu_auto_taxes_service_spec.rb:303
    op: vat_number
    input: {number: INVALID123}
    want: {valid: false}

  - name: the VAT number used across the specs is well formed
    source: spec/services/customers/eu_auto_taxes_service_spec.rb:81
    op: vat_number
    input: {number: IT12345678901}
    want: {normalized: IT12345678901, country: IT, valid: true}

  - name: fr 12 345678901 normalizes to FR12345678901
    source: tanvo
    op: vat_number
    input: {number: 'fr 12 345678901'}
    want: {normalized: FR12345678901, country: 'FR', valid: true}

  - name: FR-AB.345678901 normalizes to FRAB345678901
    source: tanvo
    op: vat_number
    input: {number: 'FR-AB.345678901'}
    want: {normalized: FRAB345678901, country: 'FR', valid: true}

  - name: FRIO345678901 normalizes to FRIO345678901
    source: tanvo
    op: vat_number
    input: {number: 'FRIO345678901'}
    want: {normalized: FRIO345678901, country: 'FR', valid: false}

  - name: DE123456789 normalizes to DE123456789
