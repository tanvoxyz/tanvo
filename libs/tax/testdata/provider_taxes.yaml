      Fees that already carry applied taxes are left alone by ComputeInvoiceAmounts
      (covered in invoice_taxes.yaml); ApplyProviderFeeTaxes has no persistence guard.
  - source: spec/services/integrations/aggregator/taxes/invoices/charge_fee_group_spec.rb:48
    reason: The provider request payload (summed units, charge identity) is built by the provider client, not here.
  - source: spec/services/integrations/aggregator/taxes/invoices/charge_fee_group_spec.rb:59
    reason: The provider request payload is built by the provider client, not here.
  - source: spec/services/integrations/aggregator/taxes/invoices/create_service_spec.rb
    reason: >-
      HTTP requests, request payloads, integration customers, webhooks and error
      responses belong to the provider clients; only the breakdown mapping is ported.
  - source: spec/services/integrations/aggregator/taxes/invoices/create_draft_service_spec.rb
    reason: >-
