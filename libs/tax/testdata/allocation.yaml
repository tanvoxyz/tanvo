# Allocation of a total over weights (Allocate, AllocatePrecise,
# AllocateByGroup), ported from spec/services/integrations/aggregator/taxes/allocation_spec.rb. Where
# lago asserts properties of the result (its sum, the values it takes), the
# exact, deterministic result is given: residue cents go to the largest
# fractional remainders, ties to the earlier part.
cases:
  - name: booked amounts are kept even when exact shares differ
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:18
    op: allocate_by_group
    input: {total: 5, groups: [{amount_cents: [2], precise_amount_cents: [2.5]}, {amount_cents: [3], precise_amount_cents: [2.5]}]}
    want: [2, 3]

  - name: one group rounded to zero
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:24
    op: allocate_by_group
    input: {total: 5, groups: [{amount_cents: [0], precise_amount_cents: [2.5]}, {amount_cents: [2], precise_amount_cents: [2.5]}]}
    want: [0, 5]

  - name: every group rounded to zero weighs by the exact amounts
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:30
    op: allocate_by_group
    input: {total: 5, groups: [{amount_cents: [0], precise_amount_cents: [2.5]}, {amount_cents: [0], precise_amount_cents: [2.5]}]}
    want: [3, 2]

  - name: exact shares keep their fractional cents
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:41
    op: allocate_precise
    input: {total: 7, weights: [3, 7]}
    want: [2.1, 4.9]

  - name: decimal weights and a decimal total
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:50
    op: allocate_precise
    input: {total: 0.3, weights: [0.1, 0.2]}
    want: [0.1, 0.2]

  - name: a negative total gives negative shares
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:56
    op: allocate_precise
    input: {total: -7, weights: [3, 7]}
    want: [-2.1, -4.9]

  - name: no total gives zeros
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:62
    op: allocate_precise
    input: {weights: [3, 7]}
    want: [0, 0]

  - name: weights without value give exact zeros
    source: spec/services/integrations/aggregator/taxes/allocation_spec.rb:68
    op: allocate_precise
    input: {total: 7, weights: [0, 0]}
    want: [0, 0]

