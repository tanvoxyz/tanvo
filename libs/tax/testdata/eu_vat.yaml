# EU VAT: the vendored rate table (data/eu_vat_rates.json), the generated
# taxes and the customer tax decision before and after a VIES check. Tax
# codes are prefixed tanvo_eu_ where lago uses lago_eu_. The billing entity
# is in France.
cases:
  - name: the table lists the 27 member states
    source: spec/lib/lago_eu_vat/rate_spec.rb:10
    op: eu_country_codes
    input: {}
    want: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]

  - name: France has a 20 % standard rate and five territories
    source: spec/lib/lago_eu_vat/rate_spec.rb:16
    op: eu_rates
    input: {country: FR, at: '2026-06-01T00:00:00Z'}
    want: {standard: 20, exceptions: [Guadeloupe, Martinique, Guyane, Reunion, Mayotte]}

  - name: the generated taxes are the EU taxes plus reverse charge and exempt
    source: spec/services/taxes/auto_generate_service_spec.rb:11
    op: eu_taxes
    input: {at: '2026-06-01T00:00:00Z'}
    want: {count: 47}

  - name: an updated customer with an EU tax and unchanged attributes is left alone
    source: spec/services/customers/eu_auto_taxes_service_spec.rb:36
    op: eu_tax
    input: {billing_country: FR, at: '2026-06-01T00:00:00Z', customer: {country: DE}, applicable: {new_record: false, has_eu_tax: true, tax_attributes_changed: false}}
    want: {applicable: false}

  - name: an updated customer without an EU tax gets one
    source: spec/services/customers/eu_auto_taxes_service_spec.rb:55
    op: eu_tax
    input: {billing_country: FR, at: '2026-06-01T00:00:00Z', customer: {country: DE}, applicable: {new_record: false, has_eu_tax: false, tax_attributes_changed: false}}
    want: {applicable: true, tax_code: tanvo_eu_de_standard, vies_check_required: false}

  - name: a customer without VAT number gets their country's standard tax
    source: spec/services/customers/eu_auto_taxes_service_spec.rb:67
