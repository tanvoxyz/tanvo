  - name: ungrouped fees each book the line's taxes
    source: spec/services/invoices/compute_amounts_from_fees_spec.rb:250
    op: provider_invoice
    input:
      fees:
        - {charge_id: c, amount_cents: 100, precise_amount_cents: 100}
        - {amount_cents: 100, precise_amount_cents: 100, type: add_on}
      results:
        - &ungrouped
          tax_amount_cents: 8
          breakdown:
            - {name: State, type: tax, rate: 0.025, tax_amount: 2.5}
            - {name: County, type: tax, rate: 0.025, tax_amount: 2.5}
            - {name: City, type: tax, rate: 0.025, tax_amount: 2.5}
        - *ungrouped
    want:
      amounts:
        fees: [{taxes_amount_cents: 8}, {taxes_amount_cents: 8}]
        applied_taxes:
          - {tax_name: State, amount_cents: 6}
          - {tax_name: County, amount_cents: 6}
          - {tax_name: City, amount_cents: 4}
        taxes_amount_cents: 16

  # spec/services/invoices/apply_provider_taxes_service_spec.rb: fees already
  # carry the provider rows.
  - name: the rate weighs over the taxed fees when nothing is taxable
    source: spec/services/invoices/apply_provider_taxes_service_spec.rb:79
    op: provider_invoice_taxes
    input:
      sub_total: 0
      fees:
        - amount_cents: 1000
          precise_coupons_amount_cents: 1000
          taxes_base_rate: 1
          applied_taxes: [{tax_code: tax_1, tax_name: tax 1, tax_description: type1, tax_rate: 10, provider: true}]
        - {amount_cents: 0, taxes_base_rate: 1}
    want:
      taxes_rate: 10

  - &provider_taxes
    name: provider taxes are grouped by type, name and rate
    source: spec/services/invoices/apply_provider_taxes_service_spec.rb:137
    op: provider_invoice_taxes
    input:
      sub_total: 3000
      fees:
        - amount_cents: 1000
          taxes_base_rate: 1
          applied_taxes:
            - {tax_code: tax_1, tax_name: tax 1, tax_description: type1, tax_rate: 10, provider: true, amount_cents: 100}
        - amount_cents: 2000
          taxes_base_rate: 1
          applied_taxes:
            - {tax_code: tax_1, tax_name: tax 1, tax_description: type1, tax_rate: 10, provider: true, amount_cents: 200}
            - {tax_code: tax_2, tax_name: tax 2, tax_description: type2, tax_rate: 12, provider: true, amount_cents: 240}
    want:
